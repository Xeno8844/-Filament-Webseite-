<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filament-Lager">
<title>Filament-Lager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect width='44' height='44' rx='10' fill='%23000'/><circle cx='22' cy='22' r='14' fill='none' stroke='%23545456' stroke-width='4'/><circle cx='22' cy='22' r='14' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-dasharray='66 88' transform='rotate(-90 22 22)'/><circle cx='22' cy='22' r='4' fill='%23fff'/></svg>">
<style>
/* ============================================================
   Filament-Lager — Apple-HIG-Farbsystem (dynamische System-Farben)
   ============================================================ */
:root{
  --paper:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F2F7;
  --ink:#000000; --ink-soft:#6E6E73; --ink-faint:#AEAEB2;
  --line:#C6C6C8; --line-strong:#C7C7CC;
  --ok:#34C759; --ok-soft:rgba(52,199,89,.14);
  --warn:#FF9500; --warn-soft:rgba(255,149,0,.14);
  --danger:#FF3B30; --danger-soft:rgba(255,59,48,.14);
  --shadow-s:0 1px 2px rgba(0,0,0,.06);
  --shadow-m:0 10px 30px -14px rgba(0,0,0,.28);
  --ease:cubic-bezier(.22,1,.36,1);
  --radius-s:8px; --radius-m:13px; --radius-l:20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
    --ink:#FFFFFF; --ink-soft:#98989D; --ink-faint:#636366;
    --line:#38383A; --line-strong:#48484A;
    --ok:#30D158; --ok-soft:rgba(48,209,88,.18);
    --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.18);
    --danger:#FF453A; --danger-soft:rgba(255,69,58,.18);
    --shadow-s:0 1px 2px rgba(0,0,0,.5);
    --shadow-m:0 14px 34px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --ink:#FFFFFF; --ink-soft:#98989D; --ink-faint:#636366;
  --line:#38383A; --line-strong:#48484A;
  --ok:#30D158; --ok-soft:rgba(48,209,88,.18);
  --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.18);
  --danger:#FF453A; --danger-soft:rgba(255,69,58,.18);
  --shadow-s:0 1px 2px rgba(0,0,0,.5);
  --shadow-m:0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{ background:var(--ink); color:var(--paper); }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; border-radius:6px; }
button{ font-family:inherit; }
a{ color:inherit; }
.ft-mono{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-variant-numeric:tabular-nums; }
.ft-app{ max-width:1180px; margin:0 auto;
  padding:calc(32px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right))
          calc(70px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left)); }
.ft-app svg{ display:block; }

/* ---------- header ---------- */
.ft-head{ display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
.ft-head-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.ft-brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
.ft-brand svg{ color:var(--ink); flex-shrink:0; }
.ft-brand-text{ display:flex; flex-direction:column; line-height:1; }
.ft-brand-1{ font-size:16px; font-weight:600; letter-spacing:-.015em; }
.ft-brand-2{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size:9.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-soft); margin-top:4px; }
.ft-theme-toggle{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:color .15s ease,border-color .15s ease,transform .12s var(--ease),background .15s ease; flex-shrink:0; }
.ft-theme-toggle:hover{ color:var(--ink); border-color:var(--ink-faint); }
.ft-theme-toggle:active{ transform:scale(.92); }

.ft-btn{ display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:13.5px; padding:10px 17px; border-radius:999px; border:1px solid transparent; cursor:pointer; transition:transform .12s var(--ease), background .15s ease, border-color .15s ease, color .15s ease; white-space:nowrap; }
.ft-btn:active{ transform:scale(.96); }
.ft-btn-primary{ background:var(--ink); color:var(--paper); }
.ft-btn-primary:hover{ background:var(--ink-soft); }
.ft-btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line-strong); }
.ft-btn-ghost:hover{ color:var(--ink); border-color:var(--ink-faint); }
.ft-btn-danger{ background:var(--danger); color:#fff; }
.ft-btn-sm{ padding:6px 13px; font-size:12.5px; }
.ft-btn-lg{ padding:12px 22px; font-size:14.5px; }

.ft-exportwrap{ position:relative; }
.ft-caret{ transition:transform .15s ease; }
.ft-exportwrap [aria-expanded="true"] .ft-caret{ transform:rotate(180deg); }
.ft-exportmenu{ position:absolute; top:calc(100% + 8px); right:0; z-index:70; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-m); box-shadow:var(--shadow-m); padding:8px; min-width:210px; animation:ftModalIn .15s var(--ease); }
.ft-exportmenu-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; padding:6px 10px 4px; }
.ft-exportmenu-item{ display:flex; align-items:center; gap:8px; width:100%; border:none; background:transparent; color:var(--ink); font:inherit; font-size:13px; text-align:left; padding:8px 10px; border-radius:8px; cursor:pointer; transition:background .12s ease; }
.ft-exportmenu-item:hover{ background:var(--surface-2); }
.ft-exportmenu-divider{ height:1px; background:var(--line); margin:6px 2px; }
.ft-btn[disabled]{ opacity:.45; cursor:not-allowed; }
.ft-iconbtn{ width:28px; height:28px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:color .15s ease,border-color .15s ease,transform .12s var(--ease),background .15s ease; flex-shrink:0; }
.ft-iconbtn:hover{ color:var(--ink); border-color:var(--ink-faint); }
.ft-iconbtn:active{ transform:scale(.93); }
.ft-iconbtn-danger:hover{ color:var(--danger); border-color:var(--danger); }
.ft-iconbtn-active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ---------- stats ---------- */
.ft-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.ft-stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:15px 17px; display:flex; align-items:center; gap:13px; box-shadow:var(--shadow-s); text-align:left; font:inherit; width:100%; transition:border-color .15s ease,transform .12s var(--ease),box-shadow .15s ease; }
button.ft-stat{ cursor:pointer; }
button.ft-stat:hover{ border-color:var(--ink-faint); transform:translateY(-1px); }
button.ft-stat:active{ transform:translateY(0) scale(.99); }
.ft-stat.active{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
.ft-stat-icon{ width:36px; height:36px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0; }
.ft-stat-warn .ft-stat-icon{ color:var(--warn); background:var(--warn-soft); }
.ft-stat-danger .ft-stat-icon{ color:var(--danger); background:var(--danger-soft); }
.ft-stat-value{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-weight:600; font-size:20px; line-height:1.1; }
.ft-stat-label{ font-size:12px; color:var(--ink-faint); margin-top:3px; }

/* ---------- panels ---------- */
.ft-panels{ display:grid; grid-template-columns:1fr 1.15fr; gap:12px; margin-bottom:22px; }
.ft-panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:17px 19px; box-shadow:var(--shadow-s); }
.ft-panel h3{ margin:0 0 13px; font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint); font-weight:600; }
.ft-bars{ display:flex; flex-direction:column; gap:4px; }
.ft-bar-row{ display:grid; grid-template-columns:64px 1fr 28px; align-items:center; gap:10px; font-size:12px; width:100%; border:1px solid transparent; background:transparent; padding:3px 6px; margin:0 -6px; border-radius:8px; font:inherit; cursor:pointer; transition:background .15s ease,border-color .15s ease; }
.ft-bar-row:hover{ background:var(--surface-2); }
.ft-bar-row.active{ border-color:var(--ink); background:var(--surface-2); }
.ft-bar-label{ color:var(--ink-soft); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
.ft-bar-row.active .ft-bar-label{ color:var(--ink); font-weight:700; }
.ft-bar-track{ height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
.ft-bar-fill{ display:block; height:100%; background:var(--ink); border-radius:5px; transition:width .5s var(--ease); }
.ft-bar-count{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; color:var(--ink-faint); text-align:right; }

.ft-swatch-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.ft-swatch-pill{ display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 11px 5px 6px; font-size:12px; cursor:pointer; transition:border-color .15s ease,transform .12s var(--ease),background .15s ease; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.ft-swatch-pill:hover{ border-color:var(--ink-faint); }
.ft-swatch-pill:active{ transform:scale(.96); }
.ft-swatch-pill.active{ border-color:var(--ink); background:var(--ink); color:var(--paper); }
.ft-swatch-pill.active .ft-swatch-pill-n{ color:var(--paper); opacity:.7; }
@keyframes ftPillWiggle{
  from{ transform:scale(1.06) rotate(-3deg); }
  to{ transform:scale(1.06) rotate(3deg); }
}
.ft-swatch-pill.ft-swatch-dragmode{
  animation:ftPillWiggle .22s ease-in-out infinite alternate;
  box-shadow:0 6px 16px rgba(0,0,0,.28);
  z-index:20; cursor:grabbing; touch-action:none;
}
.ft-swatch-pill.ft-swatch-floating{ position:fixed; margin:0; pointer-events:none; }
.ft-swatch-placeholder{ visibility:hidden; flex-shrink:0; border-radius:999px; background:var(--surface-2); }
.ft-dotc{ width:13px; height:13px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px rgba(120,120,128,.5); }
.ft-swatch-pill-n{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; color:var(--ink-faint); }

/* ---------- toolbar ---------- */
.ft-toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px; }
.ft-search{ position:relative; flex:1 1 240px; min-width:180px; }
.ft-search svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
.ft-search input{ width:100%; background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); border-radius:999px; padding:10px 14px 10px 36px; font:inherit; font-size:13.5px; transition:border-color .15s ease; }
.ft-search input:focus{ border-color:var(--ink); outline:none; }
.ft-select{ background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); border-radius:999px; padding:9px 14px; font:inherit; font-size:13px; cursor:pointer; }
.ft-reset{ font-size:12.5px; color:var(--ink-faint); background:none; border:none; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
.ft-reset:hover{ color:var(--ink); }
.ft-chipbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:20px; }
.ft-chipset{ display:flex; gap:6px; flex-wrap:wrap; }
.ft-fchip{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:7px 14px; font-size:12.5px; cursor:pointer; transition:all .15s ease; }
.ft-fchip:hover{ color:var(--ink); border-color:var(--ink-faint); }
.ft-fchip.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

/* ---------- grid & cards ---------- */
.ft-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px; }
.ft-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:15px; position:relative; display:flex; flex-direction:column; gap:11px; opacity:0; animation:ftCardIn .4s var(--ease) forwards; transition:transform .16s var(--ease), border-color .16s ease, box-shadow .16s ease; }
.ft-card:hover{ transform:translateY(-2px); border-color:var(--ink-faint); box-shadow:var(--shadow-m); }
@keyframes ftCardIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
.ft-card-top{ display:flex; align-items:center; justify-content:space-between; }
.ft-tag{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size:10.5px; color:var(--ink-faint); letter-spacing:.05em; }
.ft-card-actions{ display:flex; gap:4px; opacity:.5; transition:opacity .15s ease; }
.ft-card:hover .ft-card-actions,.ft-card:focus-within .ft-card-actions{ opacity:1; }

.ft-ring{ position:relative; width:116px; height:116px; margin:2px auto 0; }
.ft-ring svg{ width:100%; height:100%; }
.ft-ring-arc{ transition:stroke-dashoffset .55s var(--ease); filter:drop-shadow(0 0 .5px rgba(0,0,0,.45)) drop-shadow(0 0 .5px rgba(255,255,255,.6)); }
.ft-ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ft-ring-pct{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-weight:600; font-size:20px; }
.ft-ring-g{ font-size:10.5px; color:var(--ink-faint); margin-top:1px; }
.ft-ring-badge{ position:absolute; top:2px; right:2px; width:21px; height:21px; display:flex; align-items:center; justify-content:center; }
.ft-ring-badge-nachbestellen{ color:var(--danger); }
.ft-ring-badge-bald-leer{ color:var(--warn); }

.ft-card-body{ display:flex; flex-direction:column; gap:6px; }
.ft-card-name{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px; }
.ft-card-name-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ft-swatch{ width:15px; height:15px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px rgba(120,120,128,.5); }
.ft-card-meta{ display:flex; align-items:center; gap:8px; }
.ft-chip{ font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size:10.5px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--ink); }
.ft-chip-btn{ cursor:pointer; transition:border-color .15s ease,background .15s ease; }
.ft-chip-btn:hover{ border-color:var(--ink-faint); background:var(--surface); }
.ft-meta-text{ font-size:12.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ft-card-row{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-faint); }
.ft-dot{ width:3px; height:3px; border-radius:50%; background:var(--ink-faint); flex-shrink:0; }
.ft-card-notes{ font-size:12px; color:var(--ink-soft); font-style:italic; margin:0; border-top:1px dashed var(--line); padding-top:7px; }
.ft-status-row{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; margin-top:1px; }
.ft-status-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

.ft-confirm{ position:absolute; inset:0; background:color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter:blur(2px); border-radius:var(--radius-l); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px; font-size:13px; animation:ftFade .15s var(--ease); }
@keyframes ftFade{ from{ opacity:0;} to{ opacity:1;} }
.ft-confirm-actions{ display:flex; gap:8px; }

.ft-empty{ grid-column:1/-1; text-align:center; padding:64px 20px; color:var(--ink-faint); }
.ft-empty svg{ color:var(--ink); margin-bottom:12px; }
.ft-empty h3{ color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight:600; margin:0 0 6px; }

/* ---------- modal ---------- */
.ft-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:80; animation:ftFade .15s var(--ease); }
.ft-modal{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:24px; width:100%; max-width:1200px; max-height:90vh; overflow-y:auto; animation:ftModalIn .22s var(--ease); box-shadow:var(--shadow-m); }
@keyframes ftModalIn{ from{ opacity:0; transform:scale(.96) translateY(6px);} to{ opacity:1; transform:scale(1) translateY(0);} }
.ft-modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.ft-modal-head h2{ font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight:600; font-size:20px; margin:0; }
.ft-modal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.ft-field{ display:flex; flex-direction:column; gap:7px; font-size:12.5px; color:var(--ink-soft); }
.ft-field-wide{ grid-column:1/-1; }
.ft-field-label{ font-weight:600; display:flex; align-items:center; justify-content:space-between; }
.ft-field input[type=text],.ft-field input[type=number],.ft-field textarea{ background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink); border-radius:9px; padding:9px 11px; font:inherit; font-size:13.5px; width:100%; }
.ft-field input:focus,.ft-field textarea:focus{ border-color:var(--ink); outline:none; }
.ft-error{ color:var(--danger); font-size:11px; }

/* pick-or-create chip widget */
.ft-pick{ display:block; padding:9px; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:11px; }
.ft-pick-list{ display:flex; flex-wrap:wrap; gap:6px; }
.ft-pick-list.collapsed{ overflow:hidden; position:relative; }
.ft-pick-list.collapsed::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:24px;
  background:linear-gradient(to bottom, transparent, var(--surface-2)); pointer-events:none; }
.ft-pick-more{ display:block; width:100%; margin-top:8px; padding:6px 10px; border:1px dashed var(--line-strong);
  background:transparent; color:var(--ink-soft); border-radius:9px; font:inherit; font-size:12px;
  font-weight:600; cursor:pointer; transition:color .15s ease, border-color .15s ease; }
.ft-pick-more:hover{ color:var(--ink); border-color:var(--ink-faint); }
.ft-pick-more[hidden]{ display:none; }
.ft-pick-chip{ border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer; transition:all .15s ease; }
.ft-pick-chip:hover{ color:var(--ink); border-color:var(--ink-faint); }
.ft-pick-chip.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.ft-pick-add{ border:1px dashed var(--line-strong); background:transparent; color:var(--ink-faint); border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all .15s ease; }
.ft-pick-add:hover{ color:var(--ink); border-color:var(--ink-faint); }

.ft-pick-chip-wrap{ display:inline-flex; align-items:stretch; border:1px solid var(--line-strong); background:var(--surface); border-radius:999px; transition:all .15s ease; overflow:hidden; }
.ft-pick-chip-wrap:hover{ border-color:var(--ink-faint); }
.ft-pick-chip-wrap.active{ border-color:var(--ink); background:var(--ink); }
.ft-pick-chip-inner{ border:none; background:transparent; color:var(--ink-soft); padding:6px 6px 6px 12px; font-size:12.5px; cursor:pointer; }
.ft-pick-chip-wrap.active .ft-pick-chip-inner{ color:var(--paper); }
.ft-pick-chip-del{ border:none; background:transparent; color:var(--ink-faint); opacity:.55; padding:6px 10px 6px 4px; cursor:pointer; display:inline-flex; align-items:center; transition:opacity .15s ease,color .15s ease; }
.ft-pick-chip-del:hover{ opacity:1; color:var(--danger); }
.ft-pick-chip-wrap.active .ft-pick-chip-del{ color:var(--paper); opacity:.6; }
.ft-pick-chip-wrap.active .ft-pick-chip-del:hover{ color:#fff; opacity:1; }
.ft-pick-confirm{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--danger); background:var(--danger-soft); border-radius:999px; padding:5px 6px 5px 11px; font-size:12px; color:var(--ink); }
.ft-pick-confirm button{ border:none; border-radius:999px; padding:3px 9px; font-size:11.5px; font-weight:600; cursor:pointer; }
.ft-pick-confirm .ft-pick-confirm-yes{ background:var(--danger); color:#fff; }
.ft-pick-confirm .ft-pick-confirm-no{ background:var(--surface); color:var(--ink-soft); border:1px solid var(--line-strong) !important; }
.ft-pick-form{ display:flex; gap:6px; align-items:center; width:100%; margin-top:2px; }
.ft-pick-form input[type=text]{ flex:1; background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:7px 10px; font:inherit; font-size:12.5px; color:var(--ink); }
.ft-pick-form input[type=color]{ width:34px; height:32px; padding:2px; border:1px solid var(--line-strong); border-radius:8px; cursor:pointer; background:var(--surface); }

/* color swatch used on cards / filter pills */
.ft-swatchbtn{ width:30px; height:30px; border-radius:50%; border:2px solid transparent; box-shadow:0 0 0 1px rgba(120,120,128,.5); cursor:pointer; position:relative; flex-shrink:0; transition:transform .12s var(--ease), box-shadow .15s ease; background-clip:padding-box; }
.ft-swatchbtn:hover{ transform:scale(1.1); }
.ft-swatchbtn.active{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink), inset 0 0 0 1px rgba(255,255,255,.85); }
.ft-swatchbtn.active::after{ content:''; position:absolute; inset:0; border-radius:50%; box-shadow:0 0 0 3px var(--surface-2); }

/* modifier badges (ghost = transluzent, Glühbirne = leuchtend) */
.ft-mod-badges{ display:inline-flex; gap:3px; vertical-align:middle; margin-left:3px; }
.ft-mod-badge{ display:inline-flex; align-items:center; justify-content:center; position:relative; }
.ft-mod-badge svg{ stroke-width:2.5; }
.ft-mod-badge-translucent{ color:#4C6EF5; }
.ft-mod-badge-glow{ color:var(--warn); }
.ft-mod-badge::after{ content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%) translateY(4px);
  background:var(--ink); color:var(--paper); font-size:11px; font-weight:600; padding:4px 8px; border-radius:6px; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .12s ease, transform .12s ease; z-index:30; box-shadow:0 4px 10px rgba(0,0,0,.2); }
.ft-mod-badge:hover::after{ opacity:1; transform:translateX(-50%) translateY(0); }
.ft-cp-swatchbadges{ position:absolute; bottom:-3px; right:-3px; display:flex; gap:1px; background:var(--surface); border-radius:999px; padding:1px 2px; box-shadow:0 0 0 1px var(--line); }
.ft-cp-swatchbadges .ft-badge-ghost{ color:#4C6EF5; }
.ft-cp-swatchbadges .ft-badge-bulb{ color:var(--warn); }

/* ---------- colorpicker: Gitter / Spektrum / Regler ---------- */
.ft-colorpicker{ background:var(--surface-2); border:1px solid var(--line-strong); border-radius:14px; padding:13px; }
.ft-cp-header{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.ft-cp-preview{ width:46px; height:46px; border-radius:50%; box-shadow:0 0 0 1px rgba(120,120,128,.5), inset 0 0 0 4px var(--surface-2); flex-shrink:0; }
.ft-cp-headerinfo{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.ft-cp-name{ background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:7px 10px; font:inherit; font-size:13px; color:var(--ink); width:100%; }
.ft-cp-name:focus{ border-color:var(--ink); outline:none; }
.ft-cp-mods{ display:flex; gap:6px; flex-wrap:wrap; }
.ft-modtoggle{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-faint); border-radius:999px; padding:4px 10px; font-size:11.5px; cursor:pointer; transition:all .15s ease; }
.ft-modtoggle:hover{ color:var(--ink-soft); border-color:var(--ink-faint); }
.ft-modtoggle.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

.ft-cp-tabbar{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line-strong); border-radius:999px; padding:3px; margin-bottom:12px; }
.ft-cp-tab{ flex:1; border:none; background:transparent; color:var(--ink-faint); border-radius:999px; padding:7px 0; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .15s ease; }
.ft-cp-tab:hover{ color:var(--ink-soft); }
.ft-cp-tab.active{ background:var(--ink); color:var(--paper); }

.ft-cp-section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:600; margin:0 0 8px; }
.ft-cp-hint{ text-transform:none; letter-spacing:0; font-weight:400; }
.ft-cp-saved{ display:flex; flex-wrap:wrap; gap:11px; margin-bottom:16px; max-height:150px; overflow-y:auto; padding:2px; }
.ft-cp-swatchwrap{ position:relative; cursor:grab; }
.ft-cp-swatchwrap.dragging{ opacity:.4; }
.ft-cp-swatchdelbtn{ position:absolute; top:-4px; right:-4px; width:17px; height:17px; border-radius:50%; border:none; background:var(--surface); box-shadow:0 0 0 1px var(--line); color:var(--danger); display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transition:opacity .15s ease,color .15s ease,background .15s ease,transform .12s var(--ease); }
.ft-cp-swatchwrap:hover .ft-cp-swatchdelbtn, .ft-cp-swatchdelbtn:focus-visible{ opacity:1; }
.ft-cp-swatchdelbtn:hover{ background:var(--danger); color:#fff; transform:scale(1.08); }
.ft-cp-swatchdelbtn svg{ stroke-width:2.4; }
.ft-cp-delconfirm{ display:flex; align-items:center; gap:8px; border:1px solid var(--danger); background:var(--danger-soft); border-radius:10px; padding:8px 10px; font-size:12.5px; color:var(--ink); margin-bottom:12px; }
.ft-cp-delconfirm button{ border:none; border-radius:999px; padding:4px 11px; font-size:11.5px; font-weight:600; cursor:pointer; }
.ft-cp-delconfirm .ft-pick-confirm-yes{ background:var(--danger); color:#fff; }
.ft-cp-delconfirm .ft-pick-confirm-no{ background:var(--surface); color:var(--ink-soft); border:1px solid var(--line-strong); }
.ft-cp-huegrid{ display:grid; grid-template-columns:repeat(12,1fr); gap:2px; border-radius:8px; overflow:hidden; max-width:420px; margin:0 auto; }
.ft-cp-huecell{ aspect-ratio:1; border:none; cursor:pointer; padding:0; transition:transform .1s var(--ease); position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15), inset 0 0 0 2px rgba(255,255,255,.35); }
.ft-cp-huecell:hover{ transform:scale(1.15); z-index:1; box-shadow:0 0 0 1px var(--ink); }
.ft-cp-huecell.active{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent, var(--ink)); z-index:1; }

.ft-cp-spectrum{ display:flex; flex-direction:column; gap:10px; max-width:420px; margin:0 auto; }
.ft-cp-svsquare{ position:relative; width:100%; aspect-ratio:4/3; border-radius:10px; cursor:crosshair; touch-action:none; box-shadow:0 0 0 1px var(--line-strong); }
.ft-cp-svcursor{ position:absolute; width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.4); transform:translate(-50%,-50%); pointer-events:none; }
.ft-cp-hueslider{ -webkit-appearance:none; appearance:none; width:100%; height:14px; border-radius:999px; outline:none; cursor:pointer;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
.ft-cp-hueslider::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.35); cursor:pointer; }
.ft-cp-hueslider::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.35); cursor:pointer; }

.ft-cp-sliders{ display:flex; flex-direction:column; gap:12px; margin:0 auto 14px; max-width:420px; }
.ft-cp-slider-row{ display:grid; grid-template-columns:46px 1fr 56px; align-items:center; gap:10px; }
.ft-cp-slider-label{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
.ft-cp-slider{ -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:999px; outline:none; cursor:pointer; background:var(--line-strong); }
.ft-cp-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--ink); box-shadow:0 0 0 2px var(--surface-2); cursor:pointer; }
.ft-cp-slider::-moz-range-thumb{ width:18px; height:18px; border:none; border-radius:50%; background:var(--ink); box-shadow:0 0 0 2px var(--surface-2); cursor:pointer; }
.ft-cp-slider-num{ background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:5px 6px; font-size:12.5px; color:var(--ink); text-align:center; width:100%; }
.ft-cp-hexrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--ink-faint); max-width:420px; margin:0 auto; }
.ft-cp-hexrow input{ background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:7px 10px; font-size:13px; color:var(--ink); width:110px; text-transform:uppercase; }

/* month/year date picker */
.ft-datebtn{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink); border-radius:9px; padding:9px 11px; font:inherit; font-size:13.5px; cursor:pointer; text-align:left; }
.ft-datebtn:hover{ border-color:var(--ink-faint); }
.ft-datebtn-muted{ color:var(--ink-faint); }
.ft-datepop-wrap{ position:relative; }
.ft-datepop{ position:absolute; z-index:30; top:calc(100% + 6px); left:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-m); padding:14px; width:250px; animation:ftFade .12s var(--ease); }
.ft-datepop-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-weight:600; font-size:14px; }
.ft-datepop-months{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.ft-datepop-month{ border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-soft); border-radius:8px; padding:8px 0; font-size:12.5px; cursor:pointer; transition:all .15s ease; }
.ft-datepop-month:hover{ border-color:var(--ink-faint); color:var(--ink); }
.ft-datepop-month.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.ft-datepop-clear{ width:100%; margin-top:10px; text-align:center; font-size:12px; color:var(--ink-faint); background:none; border:none; text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:4px; }
.ft-datepop-clear:hover{ color:var(--ink); }

.ft-preview{ display:flex; gap:18px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:11px 15px; margin:18px 0; font-size:12.5px; color:var(--ink-faint); }
.ft-preview strong{ color:var(--ink); font-family:ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-weight:600; }
.ft-modal-actions{ display:flex; justify-content:flex-end; gap:10px; }

.ft-modal-sm{ max-width:480px; }
.ft-modal-body{ display:flex; flex-direction:column; gap:12px; font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
.ft-modal-body strong{ color:var(--ink); }
.ft-import-options{ display:flex; flex-wrap:wrap; gap:9px; margin-top:4px; }
.ft-import-hint{ font-size:11.5px; color:var(--ink-faint); border-top:1px solid var(--line); padding-top:12px; margin-top:2px; }

.ft-chart-wrap{ background:var(--surface-2); border-radius:10px; padding:10px; position:relative; touch-action:none; }
.ft-chart-guide{ stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3; opacity:0; transition:opacity .1s ease; }
.ft-chart-hl{ opacity:0; transition:opacity .1s ease; }
.ft-chart-tip{ position:absolute; z-index:3; pointer-events:none; opacity:0; transition:opacity .12s ease;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:9px; padding:6px 10px;
  font-size:12.5px; line-height:1.35; color:var(--ink); box-shadow:var(--shadow-m); white-space:nowrap; }
.ft-chart-range{ position:absolute; top:14px; right:16px; z-index:2; pointer-events:none;
  font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--ink-faint); }
.ft-chart-hint{ margin:3px 0 0; text-align:center; font-size:10.5px;
  color:var(--ink-faint); opacity:.85; }
.ft-chart-tip-date{ display:block; color:var(--ink-soft); font-size:11px; margin-bottom:1px; }
.ft-chart-svg{ width:100%; height:auto; aspect-ratio:400/150; display:block; }
.ft-chart-summary{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.ft-chart-current{ font-size:13.5px; color:var(--ink-soft); }
.ft-chart-current strong{ font-size:15px; }
.ft-chart-delta{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px; }
.ft-chart-up{ color:var(--ok); background:var(--ok-soft); }
.ft-chart-down{ color:var(--danger); background:var(--danger-soft); }
.ft-chart-flat{ color:var(--ink-faint); background:var(--surface-2); }
.ft-chart-empty{ margin:0; }

.ft-toaster{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:90; }
.ft-toast{ background:var(--ink); border:1px solid var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-size:13px; box-shadow:var(--shadow-m); transition:opacity .22s ease, transform .22s var(--ease); }
.ft-toast-danger{ background:var(--danger); border-color:var(--danger); }
.ft-toast-enter{ opacity:1; transform:translateY(0); }
.ft-toast-leave{ opacity:0; transform:translateY(6px); }

.ft-skel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); height:258px; position:relative; overflow:hidden; }
.ft-skel::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(120,115,95,.08),transparent); animation:ftShimmer 1.4s infinite; }
@keyframes ftShimmer{ from{ transform:translateX(-100%);} to{ transform:translateX(100%);} }

.ft-footer{ text-align:center; color:var(--ink-faint); font-size:11.5px; margin-top:34px; }
.ft-footer-dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:middle; }

@media (max-width:760px){
  .ft-stats{ grid-template-columns:repeat(2,1fr); gap:10px; }
  .ft-panels{ grid-template-columns:1fr; }
  .ft-modal-grid{ grid-template-columns:1fr; }

  /* Kopfbereich: zwei Zeilen statt vier. display:contents loest die
     Aktionsleiste auf, damit Marke und Symbole eine Zeile teilen. */
  .ft-head{ gap:8px; margin-bottom:16px; }
  .ft-head-actions{ display:contents; }
  .ft-brand{ margin-right:auto; gap:8px; }
  .ft-brand > svg{ width:26px; height:26px; }
  .ft-brand-1{ font-size:15px; }
  .ft-brand-2{ font-size:8.5px; letter-spacing:.2em; }
  .ft-sync{ height:32px; padding:0 10px; font-size:11.5px; gap:5px; }
  .ft-theme-toggle{ width:34px; height:34px; }
  .ft-head-actions > .ft-iconbtn{ width:34px; height:34px; }
  .ft-exportwrap{ flex:1 1 120px; }
  .ft-exportwrap > .ft-btn{ width:100%; justify-content:center; padding:11px 12px; }
  .ft-head .ft-btn-primary{ flex:2 1 145px; justify-content:center; }

  /* Groessere Ziele fuer den Finger */
  .ft-iconbtn{ width:38px; height:38px; }
  .ft-theme-toggle{ min-height:38px; }
  /* Zwei Filamentkarten nebeneinander: alles im Inneren schrumpft mit */
  /* minmax(0,1fr) statt 1fr: sonst darf die Spalte nicht unter die
     Mindestbreite ihres Inhalts schrumpfen und das Raster laeuft ueber. */
  .ft-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .ft-card{ padding:11px 10px; gap:8px; border-radius:16px; min-width:0; }
  .ft-card-name{ min-width:0; }
  .ft-card-name-text{ min-width:0; }
  .ft-card-row{ flex-wrap:wrap; }
  .ft-card-row span{ min-width:0; }
  .ft-ring{ width:86px; height:86px; }
  .ft-ring-pct{ font-size:16px; }
  .ft-ring-g{ font-size:9.5px; }
  .ft-ring-badge{ width:18px; height:18px; top:0; right:0; }
  .ft-card-body{ gap:5px; }
  .ft-card-name{ font-size:13px; gap:6px; }
  .ft-card-meta{ flex-wrap:wrap; gap:5px; }
  .ft-card-row{ font-size:11px; gap:5px; }
  .ft-card-notes{ font-size:11px; padding-top:6px; }
  .ft-status-row{ font-size:11px; }
  /* Ohne Mauszeiger gibt es kein Hover - Schaltflaechen bleiben sichtbar */
  .ft-card-actions{ opacity:1; gap:3px; }
  .ft-card-actions .ft-iconbtn{ width:30px; height:30px; }
  .ft-confirm-actions{ flex-wrap:wrap; gap:6px; }
  .ft-confirm-actions .ft-btn{ flex:1 1 auto; justify-content:center; }


  /* Kacheln kompakter, damit die Beschriftung nicht umbricht */
  .ft-stat{ padding:12px 13px; gap:10px; }
  .ft-stat-icon{ width:30px; height:30px; }
  .ft-stat-value{ font-size:18px; }
  .ft-stat-label{ font-size:11px; line-height:1.25; }
  .ft-panel h3{ font-size:10.5px; letter-spacing:.07em; }

  /* Unter 16px zoomt iOS beim Antippen ins Feld hinein - das verhindern */
  .ft-field input[type=text], .ft-field input[type=number],
  .ft-field input[type=password], .ft-field textarea,
  .ft-select, .ft-search input{ font-size:16px; }

  /* Dialoge duerfen den Rand ausnutzen */
  .ft-overlay{ padding:10px; }
  .ft-modal{ padding:18px 16px; max-height:93vh; }
  .ft-modal-head h2{ font-size:18px; }

  .ft-toolbar{ gap:8px; }
  .ft-select{ flex:1 1 auto; }
  .ft-syncbar{ padding:11px 13px; }
  .ft-syncbar-actions{ width:100%; }
  .ft-syncbar-actions .ft-btn{ flex:1 1 auto; justify-content:center; }
}
/* ---- Geteilter Bestand (Sync über mehrere Geräte) ------------------- */
.ft-sync{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  font-size:12px; font-weight:600; white-space:nowrap; cursor:default; }
.ft-sync[data-clickable="1"]{ cursor:pointer; }
.ft-sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none; }
.ft-sync-ok .ft-sync-dot{ background:var(--ok); }
.ft-sync-warn .ft-sync-dot{ background:var(--warn); }
.ft-sync-danger .ft-sync-dot{ background:var(--danger); }
.ft-sync-busy .ft-sync-dot{ animation:ftSyncPulse 1.1s ease-in-out infinite; }
@keyframes ftSyncPulse{ 0%,100%{ opacity:.25 } 50%{ opacity:1 } }
.ft-syncbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  border:1px solid var(--warn); background:var(--warn-soft); color:var(--ink);
  border-radius:var(--radius-m); padding:12px 15px; margin-bottom:18px; font-size:13px; line-height:1.45; }
.ft-syncbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.ft-sync-dot-inline{ display:inline-block; vertical-align:middle; margin:0 0 1px 7px; }
.ft-sep{ border:none; border-top:1px solid var(--line); margin:4px 0; }
.ft-gate-note{ font-size:12px; color:var(--ink-soft); line-height:1.5; }
.ft-gate-note code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 5px; }
.ft-field input[type=password]{ background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
  border-radius:9px; padding:9px 11px; font:inherit; font-size:13.5px; width:100%; }
.ft-field input[type=password]:focus{ border-color:var(--ink); outline:none; }

@media (prefers-reduced-motion: reduce){
  .ft-card,.ft-modal,.ft-overlay,.ft-toast,.ft-datepop{ animation:none !important; transition:opacity .15s ease !important; }
  .ft-ring-arc,.ft-bar-fill{ transition:none !important; }
}

<script id="app-logic">
/* ==========================================================================

(function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Referenzdaten (Startbestückung, vom Nutzer erweiterbar)

      if (!res.ok) throw { kind: "http", status: res.status };
      return res.status === 204 ? null : res.json();
    });
  }

  var BACKENDS = {
    supabase: {
      configured: function () { return !!(SYNC.supabase.url && SYNC.supabase.anonKey); },
      rpc: function (fn, args) {
        return httpJson(SYNC.supabase.url.replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, {
          method: "POST",
          headers: {
            apikey: SYNC.supabase.anonKey,
            Authorization: "Bearer " + SYNC.supabase.anonKey,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(args)
        });
      },
      rev: function (pass) { return BACKENDS.supabase.rpc("ft_rev", { p_pass: pass }); },
      load: function (pass) {
        return BACKENDS.supabase.rpc("ft_load", { p_pass: pass }).then(function (r) {
          return { rev: r.rev, data: r.data };
        });
      },
      save: function (pass, data, baseRev) {
        return BACKENDS.supabase.rpc("ft_save", { p_pass: pass, p_data: data, p_base_rev: baseRev });
      }
    },
    selfhost: {
      configured: function () { return true; },
      at: function (path) { return (SYNC.selfhost.base || "").replace(/\/+$/, "") + path; },
      rev: function (pass) {
        return httpJson(BACKENDS.selfhost.at("/api/rev"), {
          headers: { "X-Lager-Pass": pass }, cache: "no-store"
        }).then(function (r) { return r.rev; });
      },
      load: function (pass) {
        return httpJson(BACKENDS.selfhost.at("/api/state"), {
          headers: { "X-Lager-Pass": pass }, cache: "no-store"
        });
      },
      save: function (pass, data, baseRev) {
        return fetch(BACKENDS.selfhost.at("/api/state?base=" + baseRev), {
          method: "PUT",
          headers: { "X-Lager-Pass": pass, "Content-Type": "application/json" },
          body: JSON.stringify(data)
        }).then(function (res) {
          if (res.status === 401 || res.status === 403) throw { kind: "auth" };
          if (res.status === 409) {
            return res.json().then(function (r) {
              return { ok: false, conflict: true, rev: r.rev, data: r.data };
            });
          }
          if (!res.ok) throw { kind: "http", status: res.status };
          return res.json();
        });
      }
    }
  };

  function backend() { return SYNC.mode === "off" ? null : (BACKENDS[SYNC.mode] || null); }

  function saveLocal() {
    try { window.localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  function storePass(p) { try { window.localStorage.setItem(PASS_KEY, p); } catch (e) { /* ignore */ } }
  function clearPass() { try { window.localStorage.removeItem(PASS_KEY); } catch (e) { /* ignore */ } }

  function resetToEmptyState() {
    try { window.localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
    state = normalizeState({ spools: [], palette: JSON.parse(JSON.stringify(DEFAULT_PALETTE)) });
    if (document.getElementById("grid")) renderAll();
  }

  function looksLikeState(d) { return !!(d && Array.isArray(d.spools) && d.palette && d.palette.colors); }

  /* ---- Statusanzeige ------------------------------------------------ */
  var SYNC_UI = {
    locked:     { text: "Anmelden",    cls: "ft-sync-warn",   click: 1 },
    connecting: { text: "Verbinde …", cls: "ft-sync-busy", click: 0 },
    saving:     { text: "Speichert …", cls: "ft-sync-busy", click: 0 },
    ok:         { text: "Synchron",    cls: "ft-sync-ok",     click: 0 },
    offline:    { text: "Offline",     cls: "ft-sync-warn",   click: 1 },
    conflict:   { text: "Konflikt",    cls: "ft-sync-danger", click: 0 }
  };
  function setSyncStatus(s) { sync.status = s; renderSyncPill(); }

  function renderSyncPill() {
    var host = document.getElementById("sync-pill");
    if (!host) return;
    if (SYNC.mode === "off" || sync.status === "off") { host.innerHTML = ""; return; }
    var m = SYNC_UI[sync.status] || SYNC_UI.connecting;
    host.innerHTML = '<span class="ft-sync ' + m.cls + '" data-action="sync-pill" data-clickable="' + m.click +
      '" title="Geteilter Bestand über mehrere Geräte' +
      (sync.rev >= 0 ? " — Stand " + sync.rev : "") +
      '"><span class="ft-sync-dot"></span>' + esc(m.text) + "</span>";
  }

  function renderSyncBar() {
    var host = document.getElementById("sync-bar");
    if (!host) return;
    if (!sync.conflict) { host.innerHTML = ""; return; }
    host.innerHTML =
      '<div class="ft-syncbar">' +
      "<span><strong>Konflikt.</strong> Auf einem anderen Gerät wurde derselbe Bestand geändert. " +
      "Deine letzten Änderungen sind noch nicht auf dem Server. Welche Version soll gelten?</span>" +
      '<span class="ft-syncbar-actions">' +
      '<button type="button" class="ft-btn ft-btn-ghost ft-btn-sm" data-action="sync-take-server">Server-Version laden</button>' +
      '<button type="button" class="ft-btn ft-btn-primary ft-btn-sm" data-action="sync-keep-mine">Meine Version hochladen</button>' +
      "</span></div>";
  }

  function resolveConflict(keepMine) {
    var c = sync.conflict;
    if (!c) return;
    sync.conflict = null;
    renderSyncBar();
    if (keepMine || !looksLikeState(c.data)) { syncPush(true); return; }
    sync.rev = c.rev;
    state = normalizeState(c.data);

    setSyncStatus("ok");
    pushToast("Server-Version übernommen");
  }

  /* ---- Passwort-Abfrage --------------------------------------------- */
  function renderGate() {
    var host = document.getElementById("gate-root");
    if (!host) return;
    if (sync.status !== "locked") { host.innerHTML = ""; return; }
    host.innerHTML =
      '<div class="ft-overlay">' +
      '<div class="ft-modal ft-modal-sm">' +
      '<div class="ft-modal-head"><h2>Bestand freischalten</h2></div>' +
      '<form class="ft-modal-body" id="gate-form">' +
      "<p>Der Bestand ist passwortgeschützt und liegt nicht in dieser Seite, sondern auf dem Server. " +
      "Bitte einmalig das Passwort eingeben — es wird auf diesem Gerät gespeichert und danach " +
      "nicht mehr abgefragt.</p>" +
      '<label class="ft-field" for="gate-pass"><span class="ft-field-label">Passwort</span>' +
      '<input type="password" id="gate-pass" autocomplete="current-password" /></label>' +
      '<p class="ft-error">' + esc(sync.gateError) + "</p>" +
      '<div class="ft-modal-actions">' +
      '<button type="submit" class="ft-btn ft-btn-primary"' + (sync.gateBusy ? " disabled" : "") +
      ">Freischalten</button>" +
      "</div></form></div></div>";

    document.getElementById("gate-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("gate-pass").value;
      if (!v) { sync.gateError = "Bitte Passwort eingeben."; renderGate(); return; }
      sync.pass = v;
      sync.gateError = ""; sync.gateBusy = true;
      renderGate();
      syncConnect();
    });
    var pw = document.getElementById("gate-pass");
    if (pw && !sync.gateBusy) pw.focus();
  }

  /* ---- Verbinden, Laden, Speichern, Abgleichen ----------------------- */
  function handleSyncError(err) {
    sync.gateBusy = false;
    sync.pushing = false;
    if (err && err.kind === "auth") {
      clearPass();
      sync.pass = null;
      sync.rev = -1;
      sync.conflict = null;
      resetToEmptyState();
      sync.status = "locked";
      sync.gateError = "Passwort stimmt nicht.";
      renderSyncPill(); renderSyncBar(); renderGate();
    } else {
      setSyncStatus("offline");
      startSyncPolling();
    }
  }

  function syncInit() {
    var b = backend();
    if (!b || !b.configured()) { sync.status = "off"; renderSyncPill(); return; }
    sync.on = true;
    try { sync.pass = window.localStorage.getItem(PASS_KEY) || null; } catch (e) { sync.pass = null; }
    if (!sync.pass) { resetToEmptyState(); setSyncStatus("locked"); renderGate(); return; }
    syncConnect();
  }

  function syncConnect() {
    var b = backend();
    if (!b || !sync.pass) return Promise.resolve();
    setSyncStatus("connecting");
    return b.load(sync.pass).then(function (res) {
      storePass(sync.pass);
      sync.gateBusy = false;
      sync.rev = res.rev;
      setSyncStatus("ok");
      renderGate();
      if (looksLikeState(res.data)) {
        state = normalizeState(res.data);
        saveLocal(); renderAll();
      } else {
        // Server noch leer -> lokalen Bestand als Startbestand hochladen
        syncPush(true);
      }
      startSyncPolling();
    }).catch(handleSyncError);
  }

  var syncPushTimer = null;
  function syncSchedulePush() {
    if (!sync.on || !sync.pass || sync.status === "off") return;
    if (syncPushTimer) clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(function () { syncPushTimer = null; syncPush(false); }, 800);
  }

  function syncPush(force) {
    var b = backend();
    if (!b || !sync.pass || sync.status === "off") return Promise.resolve();
    if (sync.pushing) { sync.pushAgain = true; return Promise.resolve(); }
    if (sync.conflict && !force) return Promise.resolve();
    sync.pushing = true;
    setSyncStatus("saving");
    return b.save(sync.pass, state, force ? -1 : sync.rev).then(function (res) {
      sync.pushing = false;
      if (res && res.ok) {
        sync.rev = res.rev;
        sync.conflict = null; renderSyncBar();
        setSyncStatus("ok");
        if (sync.pushAgain) { sync.pushAgain = false; syncSchedulePush(); }
        startSyncPolling();
      } else if (res && res.conflict) {
        sync.pushAgain = false;
        sync.conflict = { rev: res.rev, data: res.data };
        setSyncStatus("conflict");
        renderSyncBar();
      }
    }).catch(handleSyncError);
  }

  function syncPull() {
    var b = backend();
    if (!b || !sync.pass) return Promise.resolve();
    return b.load(sync.pass).then(function (res) {
      if (!looksLikeState(res.data)) return;
      sync.rev = res.rev;
      state = normalizeState(res.data);
      saveLocal(); renderAll();
      setSyncStatus("ok");
      pushToast("Bestand von einem anderen Gerät übernommen");
    }).catch(handleSyncError);
  }

  var syncPollTimer = null;
  function startSyncPolling() {
    if (syncPollTimer || SYNC.mode === "off") return;
    syncPollTimer = setInterval(syncTick, SYNC.pollMs);
  }

  function syncTick() {
    var b = backend();
    if (!b || !sync.pass || sync.status === "off") return;
    if (document.hidden) return;
    // Nichts holen, solange lokal gespeichert oder bearbeitet wird
    if (sync.pushing || syncPushTimer || sync.conflict) return;
    if (ui.modal || ui.importDialog) return;
    b.rev(sync.pass).then(function (rev) {
      if (sync.status === "offline") setSyncStatus("ok");
      if (typeof rev === "number" && rev !== sync.rev) syncPull();
    }).catch(handleSyncError);
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden) syncTick(); });
  window.addEventListener("online", function () { syncTick(); });

  /* ---- Abschnitt im Einstellungen-Dialog ----------------------------- */
  function syncSettingsHtml() {
    if (SYNC.mode === "off") {
      return '<hr class="ft-sep"/><p class="ft-gate-note"><strong>Geteilter Bestand:</strong> nicht eingerichtet — ' +
        "der Bestand liegt nur auf diesem Gerät. Zum Einrichten den Block " +
        "<code>var SYNC</code> in <code>index.html</code> ausfüllen.</p>";
    }
    var m = SYNC_UI[sync.status];
    return '<hr class="ft-sep"/>' +
      '<p class="ft-gate-note ' + (m ? m.cls : "") + '"><strong>Geteilter Bestand:</strong> ' +
      esc(m ? m.text : sync.status) + '<span class="ft-sync-dot ft-sync-dot-inline"></span>' +
      "</p>" +
      '<div class="ft-syncbar-actions">' +
      '<button type="button" class="ft-btn ft-btn-ghost ft-btn-sm" data-action="sync-pull-now">Vom Server laden</button>' +
      '<button type="button" class="ft-btn ft-btn-ghost ft-btn-sm" data-action="sync-push-now">Jetzt hochladen</button>' +
      '<button type="button" class="ft-btn ft-btn-ghost ft-btn-sm" data-action="sync-logout">Gerät abmelden</button>' +
      "</div>";
  }

  var publishTimer = null;
  function persist() {
    recordHistorySnapshot();
    saveLocal();
    syncSchedulePush();
    if (publishTimer) clearTimeout(publishTimer);
    publishTimer = setTimeout(function () {
      artifactReady.then(function (api) {
        if (!api) return;
        api.publish(buildFullDocument()).catch(function () { /* conflict/rate-limit: local copy still authoritative for this view */ });
      });
    }, 500);
  }

  /* ------------------------------------------------------------------ *
   * Toasts
   * ------------------------------------------------------------------ */
  var toasts = [];
  function pushToast(message, tone) {
    var t = { id: uid(), message: message, tone: tone || "default" };
    toasts.push(t);
    renderToasts();
    setTimeout(function () {
      var el = document.getElementById("toast-" + t.id);
      if (el) el.classList.add("ft-toast-leave");
    }, 2600);
    setTimeout(function () {
      toasts = toasts.filter(function (x) { return x.id !== t.id; });
      renderToasts();
    }, 2900);
  }
  function renderToasts() {
    var host = document.getElementById("toaster");
    if (!host) return;
    host.innerHTML = toasts.map(function (t) {
      return '<div id="toast-' + t.id + '" class="ft-toast ft-toast-enter' + (t.tone === "danger" ? " ft-toast-danger" : "") + '">' + esc(t.message) + "</div>";
    }).join("");
  }

  /* ------------------------------------------------------------------ *
   * Mutations
   * ------------------------------------------------------------------ */
  function addSpool(entry) {
    state.spools.push(Object.assign({}, entry, { id: uid() }));
    persist(); renderAll(); pushToast("Spule hinzugefügt");
  }
  function updateSpool(id, entry) {
    state.spools = state.spools.map(function (s) { return s.id === id ? Object.assign({}, entry, { id: id }) : s; });
    persist(); renderAll(); pushToast("Spule aktualisiert");
  }
  function deleteSpool(id) {
    state.spools = state.spools.filter(function (s) { return s.id !== id; });
    persist(); renderAll(); pushToast("Spule gelöscht", "danger");
  }
  function addPaletteValue(kind, value) {
    var v = (value || "").trim();
    if (!v) return null;
    var arr = state.palette[kind];
    var exists = arr.some(function (x) { return (typeof x === "string" ? x : x.name).toLowerCase() === v.toLowerCase(); });
    if (!exists) { arr.push(v); persist(); }
    return v;
  }
  function addPaletteColor(name, hex, mods) {
    var n = (name || "").trim();
    if (!n) return null;
    mods = mods || {};
    var existing = findColor(n);
    if (existing) {
      existing.hex = hex;
      existing.translucent = !!mods.translucent;
      existing.glow = !!mods.glow;
      persist();
      return existing;
    }
    var c = { name: n, hex: hex || "#8A8272", translucent: !!mods.translucent, glow: !!mods.glow };
    state.palette.colors.push(c);
    persist();
    return c;
  }
  function archivePaletteValue(kind, value) {
    var arr = state.palette.archived[kind];
    if (arr.indexOf(value) === -1) { arr.push(value); persist(); renderAll(); }
  }
  function unarchivePaletteValue(kind, value) {
    var arr = state.palette.archived[kind];
    var idx = arr.indexOf(value);
    if (idx !== -1) { arr.splice(idx, 1); persist(); renderAll(); }
  }
  function isValueUsedBySpools(kind, value) {
    var field = kind === "materials" ? "material" : kind === "hersteller" ? "hersteller" : kind === "verpackungen" ? "verpackung" : "lagerort";
    return state.spools.some(function (s) { return s[field] === value; });
  }
  function countValueUsage(kind, value) {
    var field = kind === "materials" ? "material" : kind === "hersteller" ? "hersteller" : kind === "verpackungen" ? "verpackung" : "lagerort";
    var n = 0;
    state.spools.forEach(function (s) { if (s[field] === value) n++; });
    return n;
  }
  function archiveColor(name) {
    var c = findColor(name);
    if (c) { c.archived = true; persist(); renderAll(); }
  }
  function countColorUsage(name) {
    var n = 0;
    state.spools.forEach(function (s) { if (s.farbe === name) n++; });
    return n;
  }
  function reorderPaletteColors(fromName, toName) {
    var arr = state.palette.colors;
    var fromIdx = arr.findIndex(function (c) { return c.name === fromName; });
    var toIdx = arr.findIndex(function (c) { return c.name === toName; });
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    var moved = arr.splice(fromIdx, 1)[0];
    arr.splice(toIdx, 0, moved);
    persist();
  }

  /* ------------------------------------------------------------------ *
   * Ableitungen / Filterung
   * ------------------------------------------------------------------ */
  /* Kaufdatum als vergleichbare Zahl: "2025-03" -> 202503, "2025" -> 202500,
     leer -> -1. Bewusst numerisch statt als Zeichenkette, denn der
     Datumswaehler schreibt Monate ohne fuehrende Null ("2025-3"), und
     "2025-3" waere als Text groesser als "2025-10". */
  function kaufSchluessel(s) {
    var treffer = /^(\d{4})(?:-(\d{1,2}))?$/.exec(s.kaufdatum || "");
    if (!treffer) return -1;
    return parseInt(treffer[1], 10) * 100 + (treffer[2] ? parseInt(treffer[2], 10) : 0);
  }
  function sortiereNachKauf(list, neusteZuerst) {
    return list.slice().sort(function (a, b) {
      var ka = kaufSchluessel(a), kb = kaufSchluessel(b);
      // Spulen ohne Kaufdatum stehen immer am Ende - in beide Richtungen
      if (ka < 0 && kb < 0) return 0;
      if (ka < 0) return 1;
      if (kb < 0) return -1;
      return neusteZuerst ? kb - ka : ka - kb;
    });
  }

  function computeFiltered() {

    var q = ui.search.trim().toLowerCase();
    var list = state.spools.filter(function (s) {
      if (q) {
        var hay = (s.farbe + " " + s.material + " " + s.hersteller + " " + s.lagerort + " " + s.notizen).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (ui.filterMaterial && s.material !== ui.filterMaterial) return false;
      if (ui.filterStatus && getStatus(s) !== ui.filterStatus) return false;
      if (ui.filterColor && s.farbe !== ui.filterColor) return false;
      if (ui.filterTranslucent || ui.filterGlow) {
        var mods = getColorMods(s.farbe);
        if (ui.filterTranslucent && !mods.translucent) return false;
        if (ui.filterGlow && !mods.glow) return false;
      }
      return true;
    });
    if (ui.sortBy === "neu") return sortiereNachKauf(list, true);
    if (ui.sortBy === "alt") return sortiereNachKauf(list, false);
    if (ui.sortBy === "farbe") return list.slice().sort(function (a, b) { return a.farbe.localeCompare(b.farbe, "de"); });
    if (ui.sortBy === "restAsc") return list.slice().sort(function (a, b) { return getRestbestand(a) - getRestbestand(b); });
    if (ui.sortBy === "restDesc") return list.slice().sort(function (a, b) { return getRestbestand(b) - getRestbestand(a); });
    return list;
  }
  function computeStats() {
    var totalNetto = state.spools.reduce(function (sum, s) { return sum + getNetto(s); }, 0);
    var baldLeer = state.spools.filter(function (s) { return getStatus(s) === "bald-leer"; }).length;
    var nachbestellen = state.spools.filter(function (s) { return getStatus(s) === "nachbestellen"; }).length;
    var byMaterial = {};
    state.spools.forEach(function (s) { byMaterial[s.material] = (byMaterial[s.material] || 0) + 1; });
    var materialList = Object.keys(byMaterial).map(function (m) { return { material: m, count: byMaterial[m] }; })
      .sort(function (a, b) { return b.count - a.count; });
    var byColor = {};
    state.spools.forEach(function (s) { byColor[s.farbe] = (byColor[s.farbe] || 0) + 1; });
    var colorList = Object.keys(byColor).map(function (f) { return { farbe: f, count: byColor[f], hex: getColorHex(f) }; })
      .sort(function (a, b) { return b.count - a.count; });
    var customOrder = (state.settings && state.settings.colorFilterOrder) || [];
    if (customOrder.length) {
      var used = {};
      var ordered = [];
      customOrder.forEach(function (name) {
        var match = colorList.find(function (c) { return c.farbe === name; });
        if (match && !used[name]) { ordered.push(match); used[name] = true; }
      });
      colorList.forEach(function (c) { if (!used[c.farbe]) ordered.push(c); });
      colorList = ordered;
    }
    colorList = colorList.slice(0, 16);
    return { totalNetto: totalNetto, baldLeer: baldLeer, nachbestellen: nachbestellen, byMaterial: materialList, byColor: colorList };
  }

  /* ------------------------------------------------------------------ *
   * Rendering — statischer Rahmen einmalig, danach gezielte Updates
   * ------------------------------------------------------------------ */
  function modBadges(name, size) {
    var m = getColorMods(name);
    if (!m.translucent && !m.glow) return "";
    var s = size || 11;
    var out = '<span class="ft-mod-badges">';
    if (m.translucent) out += '<span class="ft-mod-badge ft-mod-badge-translucent" data-tip="Transparent">' + icon("ghost", s) + "</span>";
    if (m.glow) out += '<span class="ft-mod-badge ft-mod-badge-glow" data-tip="Leuchtend">' + icon("bulb", s) + "</span>";
    return out + "</span>";
  }
  function swatchStyle(name) {
    if (isMultiColor(name)) return "background:" + rainbowCssGradient() + ";";
    var hex = getColorHex(name);
    var op = isTransparentColor(name) ? "opacity:.55;" : "";
    return "background:" + hex + ";" + op;
  }

  // Farben exakt aus dem vom Nutzer bereitgestellten Referenz-Farbkreis übernommen
  // (Gelb, Orange, Rot, Violett, Blau, Grün — in dieser Reihenfolge im Kreis).
  var WHEEL_COLORS = ["#F4E601", "#F08C1D", "#E32322", "#713985", "#2B70B1", "#058F5A"];
  var RAINBOW_STOPS = WHEEL_COLORS.concat([WHEEL_COLORS[0]]);
  function rainbowCssGradient() {
    // Voll ausgefüllter Kreis mit klar getrennten Farbsegmenten, genau wie im
    // Referenz-Farbkreis — kein Verlauf, keine Box innerhalb des Kreises.
    var n = WHEEL_COLORS.length;
    var stops = WHEEL_COLORS.map(function (hex, i) {
      return hex + " " + ((i / n) * 100).toFixed(2) + "%," + hex + " " + (((i + 1) / n) * 100).toFixed(2) + "%";
    }).join(",");
    return "conic-gradient(" + stops + ")";
  }
  function rainbowGradientDefs() {
    var stops = RAINBOW_STOPS.map(function (hex, i) {
      return '<stop offset="' + Math.round((i / (RAINBOW_STOPS.length - 1)) * 100) + '%" stop-color="' + hex + '"/>';
    }).join("");
    return '<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">' +
      '<defs><linearGradient id="ft-rainbow" x1="0%" y1="0%" x2="100%" y2="100%">' + stops + "</linearGradient></defs></svg>";
  }

  function renderShell() {
    var root = document.getElementById("root");
    root.innerHTML =
      rainbowGradientDefs() +
      '<div class="ft-app">' +

  /* ------------------------------------------------------------------ *
   * "Nach Farbe"-Chips: per Long-Press + Ziehen manuell umsortieren
   * ------------------------------------------------------------------ */
  function wireColorFilterReorder(root) {
    var LONG_PRESS_MS = 450;
    var MOVE_CANCEL_PX = 9;
    var pending = null; // { name, startX, startY, timer, moveListener, upListener }
    var drag = null; // { name, el, placeholder, floating, grabX, grabY }
    var lastSwapAt = 0;
    var SWAP_THROTTLE_MS = 120; // verhindert schnelles Hin-und-Her-Springen beim Umsortieren

    function clearPending() {
      if (!pending) return;
      clearTimeout(pending.timer);
      root.removeEventListener("pointermove", pending.moveListener);
      root.removeEventListener("pointerup", pending.upListener);
      root.removeEventListener("pointercancel", pending.upListener);
      pending = null;
    }

    function armDrag(name, el) {
      drag = { name: name, el: el, placeholder: null, floating: false, grabX: 0, grabY: 0 };
      el.classList.add("ft-swatch-dragmode");
    }

    function currentPanelOrder() {
      var container = document.getElementById("panel-color");
      if (!container) return [];
      return Array.prototype.map.call(container.querySelectorAll(".ft-swatch-pill"), function (n) { return n.dataset.colorName; });
    }

    // Löst den gezogenen Chip aus dem normalen Layoutfluss (position:fixed, folgt
    // dem Zeiger 1:1) und lässt an seiner Stelle einen unsichtbaren Platzhalter
    // zurück, der stattdessen zwischen den anderen Chips hin- und herspringt.
    // So bewegt sich der gezogene Chip völlig frei, ohne selbst zu "springen".
    function startFloating(e) {
      var rect = drag.el.getBoundingClientRect();
      drag.grabX = e.clientX - rect.left;
      drag.grabY = e.clientY - rect.top;
      var ph = document.createElement("span");
      ph.className = "ft-swatch-placeholder";
      ph.style.width = rect.width + "px";
      ph.style.height = rect.height + "px";
      drag.el.parentNode.insertBefore(ph, drag.el);
      drag.placeholder = ph;
      drag.el.style.width = rect.width + "px";
      drag.el.classList.add("ft-swatch-floating");
      drag.el.style.left = rect.left + "px";
      drag.el.style.top = rect.top + "px";
      drag.floating = true;
    }

    // FLIP-Technik: misst die Positionen der Geschwister-Chips vor der
    // Platzhalter-Verschiebung und lässt sie sanft in ihre neue Position
    // gleiten, statt abrupt zu springen.
    function flipMove(container, mutate) {
      var pills = Array.prototype.slice.call(container.querySelectorAll(".ft-swatch-pill, .ft-swatch-placeholder"))
        .filter(function (p) { return p !== drag.el; });
      var firstRects = pills.map(function (p) { return p.getBoundingClientRect(); });
      mutate();
      pills.forEach(function (p, i) {
        var last = p.getBoundingClientRect();
        var dx = firstRects[i].left - last.left;
        var dy = firstRects[i].top - last.top;
        if (dx || dy) {
          p.style.transition = "none";
          p.style.transform = "translate(" + dx + "px," + dy + "px)";
          p.getBoundingClientRect(); // reflow erzwingen
          requestAnimationFrame(function () {
            p.style.transition = "transform .2s ease";
            p.style.transform = "";
          });
        }
      });
    }

    function finishDrag() {
      if (!drag) return;
      drag.el.classList.remove("ft-swatch-dragmode", "ft-swatch-floating");
      drag.el.style.left = "";
      drag.el.style.top = "";
      drag.el.style.width = "";
      if (drag.placeholder && drag.placeholder.parentNode) {
        drag.placeholder.parentNode.insertBefore(drag.el, drag.placeholder);
        drag.placeholder.parentNode.removeChild(drag.placeholder);
      }
      var order = currentPanelOrder();
      state.settings.colorFilterOrder = order;
      persist();
      drag = null;
      renderColorPanel();
      // Den synthetischen Klick, den der Browser nach dem Loslassen auslösen kann,
      // abfangen, damit ein Umsortieren nicht gleichzeitig den Farbfilter umschaltet.
      var suppressClick = function (ev) { ev.stopPropagation(); };
      document.addEventListener("click", suppressClick, { capture: true, once: true });
      setTimeout(function () { document.removeEventListener("click", suppressClick, { capture: true }); }, 60);
    }

    root.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      var pill = e.target.closest("#panel-color .ft-swatch-pill");
      if (!pill) return;
      var name = pill.dataset.colorName;
      if (!name) return;
      var startX = e.clientX, startY = e.clientY;
      var moveListener = function (ev) {
        if (drag) return;
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) clearPending();
      };
      var upListener = function () { clearPending(); };
      var timer = setTimeout(function () {
        armDrag(name, pill);
        pending = null;
        root.removeEventListener("pointermove", moveListener);
        root.removeEventListener("pointerup", upListener);
        root.removeEventListener("pointercancel", upListener);
      }, LONG_PRESS_MS);
      pending = { name: name, timer: timer, moveListener: moveListener, upListener: upListener };
      root.addEventListener("pointermove", moveListener);
      root.addEventListener("pointerup", upListener);
      root.addEventListener("pointercancel", upListener);
    });

    root.addEventListener("pointermove", function (e) {
      if (!drag) return;
      e.preventDefault();
      if (!drag.floating) startFloating(e);
      drag.el.style.left = (e.clientX - drag.grabX) + "px";
      drag.el.style.top = (e.clientY - drag.grabY) + "px";

      var container = document.getElementById("panel-color");
      if (!container) return;
      var under = document.elementFromPoint(e.clientX, e.clientY);
      var target = under && under.closest && under.closest("#panel-color .ft-swatch-pill");
      if (!target || target === drag.el) return;
      var children = Array.prototype.slice.call(container.querySelectorAll(".ft-swatch-pill, .ft-swatch-placeholder"));
      var fromIdx = children.indexOf(drag.placeholder);
      var toIdx = children.indexOf(target);
      if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
      // Zeitliche Bremse: nicht öfter als alle SWAP_THROTTLE_MS umsortieren, sonst kann
      // der Platzhalter durch die Verschiebung selbst wieder unter den Zeiger geraten
      // und sofort zurückspringen (schnelles Hin-und-Her).
      var now = Date.now();
      if (now - lastSwapAt < SWAP_THROTTLE_MS) return;
      lastSwapAt = now;
      flipMove(container, function () {
        if (fromIdx < toIdx) target.parentNode.insertBefore(drag.placeholder, target.nextSibling);
        else target.parentNode.insertBefore(drag.placeholder, target);
      });
    }, { passive: false });

    root.addEventListener("pointerup", function () { if (drag) finishDrag(); });
    root.addEventListener("pointercancel", function () { if (drag) finishDrag(); });
  }

  function renderResetLink() {
    var wrap = document.getElementById("reset-wrap");

  function renderStats() {
    var st = computeStats();
    var host = document.getElementById("stats");
    host.innerHTML =
      statTile(icon("boxes", 16), "Spulen gesamt", state.spools.length, "", null, "spools") +
      statTile(icon("weight", 16), "Nettogewicht gesamt", (st.totalNetto / 1000).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " kg", "", null, "netto") +
      statTile(icon("alertTriangle", 16), "Bald leer (<" + state.settings.baldLeerPct + "%)", st.baldLeer, "warn", "bald-leer") +
      statTile(icon("alertOctagon", 16), "Nachbestellen (<" + state.settings.nachbestellenPct + "%)", st.nachbestellen, "danger", "nachbestellen");
  }
  function statTile(iconHtml, label, value, tone, filterValue, chartMetric) {
    var tag = (filterValue || chartMetric) ? "button" : "div";
    var active = filterValue && ui.filterStatus === filterValue;
    var attrs = filterValue
      ? ' type="button" data-action="toggle-status-filter" data-value="' + filterValue + '" title="Klicken zum Filtern"'
      : chartMetric
        ? ' type="button" data-action="open-chart" data-metric="' + chartMetric + '" title="Verlauf anzeigen"'
        : "";
    return "<" + tag + ' class="ft-stat' + (tone ? " ft-stat-" + tone : "") + (active ? " active" : "") + '"' + attrs + ">" +
      '<div class="ft-stat-icon">' + iconHtml + "</div>" +
      '<div><div class="ft-stat-value ft-mono">' + esc(value) + '</div><div class="ft-stat-label">' + esc(label) + "</div></div></" + tag + ">";
  }

  function renderMaterialPanel() {
    var st = computeStats();
    var max = st.byMaterial.reduce(function (m, x) { return Math.max(m, x.count); }, 1);
    document.getElementById("panel-material").innerHTML = st.byMaterial.map(function (m, i) {
      var pct = Math.round((m.count / max) * 100);
      var active = ui.filterMaterial === m.material;
      var barColor = MATERIAL_BAR_COLORS[i % MATERIAL_BAR_COLORS.length];
      var info = MATERIAL_INFO[m.material.toUpperCase()];
      var titleAttr = info ? ' title="' + esc(m.material + " — " + info) + '"' : "";
      return '<button type="button" class="ft-bar-row' + (active ? " active" : "") + '" data-action="toggle-material-filter" data-value="' + esc(m.material) + '"' + titleAttr + '>' +
        '<span class="ft-bar-label">' + esc(m.material) + '</span>' +
        '<span class="ft-bar-track"><span class="ft-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></span></span>' +
        '<span class="ft-bar-count ft-mono">' + m.count + "</span></button>";
    }).join("") || '<p style="color:var(--ink-faint);font-size:12.5px;margin:0;">Noch keine Daten.</p>';
  }

  function renderColorPanel() {
    var st = computeStats();
    document.getElementById("panel-color").innerHTML = st.byColor.map(function (c) {
      var active = ui.filterColor === c.farbe;
      return '<button class="ft-swatch-pill' + (active ? " active" : "") + '" data-action="toggle-color-filter" data-value="' + esc(c.farbe) + '" data-color-name="' + esc(c.farbe) + '">' +
        '<span class="ft-dotc" style="' + swatchStyle(c.farbe) + '"></span>' + esc(c.farbe) + modBadges(c.farbe, 12) +
        ' <span class="ft-swatch-pill-n">' + c.count + "</span></button>";

  }

  function renderChips() {
    document.getElementById("chip-mods").innerHTML =
      '<button class="ft-fchip' + (ui.filterTranslucent ? " active" : "") + '" data-action="toggle-mod-filter" data-value="translucent">' + icon("ghost", 13) + " Transparent</button>" +
      '<button class="ft-fchip' + (ui.filterGlow ? " active" : "") + '" data-action="toggle-mod-filter" data-value="glow">' + icon("bulb", 13) + " Leuchtend</button>";
  }

  function ringSvg(spool) {
    var pct = clamp(getRestbestand(spool), 0, 1);
    var r = 42, c = 2 * Math.PI * r, offset = c * (1 - pct);
    var stroke = isMultiColor(spool.farbe) ? "url(#ft-rainbow)" : getColorHex(spool.farbe);
    var opacity = isTransparentColor(spool.farbe) ? 0.55 : 1;
    var status = getStatus(spool);
    var badge = status !== "ok"
      ? '<span class="ft-ring-badge ft-ring-badge-' + status + '" title="' + esc(statusLabel(status)) + '">' + icon(status === "nachbestellen" ? "alertOctagon" : "alertTriangle", 11) + "</span>"
      : "";
    return '<div class="ft-ring"><svg viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="9"/>' +
      '<circle class="ft-ring-arc" cx="50" cy="50" r="' + r + '" fill="none" stroke="' + stroke + '" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" opacity="' + opacity + '" transform="rotate(-90 50 50)"/>' +
      "</svg>" +
      '<div class="ft-ring-center"><span class="ft-ring-pct ft-mono">' + Math.round(pct * 100) + '%</span><span class="ft-ring-g">' + formatGrams(getNetto(spool)) + "</span></div>" +
      badge + "</div>";
  }

  function spoolCard(spool, index) {
    var status = getStatus(spool);
    return '<div class="ft-card" style="animation-delay:' + (Math.min(index, 14) * 35) + 'ms" data-card-id="' + spool.id + '">' +
      '<div class="ft-card-top"><span class="ft-tag">' + spool.id.toUpperCase() + '</span>' +
      '<div class="ft-card-actions">' +
      '<button class="ft-iconbtn" data-action="edit-spool" data-id="' + spool.id + '" aria-label="Bearbeiten">' + icon("edit", 14) + "</button>" +
      '<button class="ft-iconbtn ft-iconbtn-danger" data-action="confirm-delete" data-id="' + spool.id + '" aria-label="Löschen">' + icon("trash", 14) + "</button>" +
      "</div></div>" +
      ringSvg(spool) +
      '<div class="ft-card-body">' +
      '<div class="ft-card-name"><span class="ft-swatch" style="' + swatchStyle(spool.farbe) + '"></span><span class="ft-card-name-text" title="' + esc(spool.farbe) + '">' + esc(spool.farbe) + "</span>" + modBadges(spool.farbe, 14) + "</div>" +
      '<div class="ft-card-meta"><button type="button" class="ft-chip ft-chip-btn" data-action="show-material-info" data-material="' + esc(spool.material) + '" title="Material-Info anzeigen">' + esc(spool.material) + '</button><span class="ft-meta-text">' + esc(spool.hersteller) + "</span></div>" +
      '<div class="ft-card-row">' + icon("mapPin", 12) + " <span>" + esc(spool.lagerort || "kein Lagerort") + "</span></div>" +
      '<div class="ft-card-row">' + icon("calendar", 12) + " <span>" + esc(formatKaufdatum(spool.kaufdatum)) + '</span><span class="ft-dot"></span><span>' + esc(spool.verpackung) + "</span></div>" +
      (spool.notizen ? '<p class="ft-card-notes">' + esc(spool.notizen) + "</p>" : "") +
      "</div>" +
      '<div class="ft-status-row" style="color:' + STATUS_META[status].color + '"><span class="ft-status-dot" style="background:' + STATUS_META[status].color + '"></span>' + esc(statusLabel(status)) + "</div>" +
      (ui.confirmDeleteId === spool.id ?
        '<div class="ft-confirm"><span>Spule löschen?</span><div class="ft-confirm-actions">' +
        '<button class="ft-btn ft-btn-ghost ft-btn-sm" data-action="cancel-delete">Abbrechen</button>' +
        '<button class="ft-btn ft-btn-danger ft-btn-sm" data-action="do-delete" data-id="' + spool.id + '">Löschen</button>' +
        "</div></div>" : "") +
      "</div>";
  }

  function renderGrid() {
    renderResetLink();

    var filtered = computeFiltered();
    if (state.spools.length === 0) {
      host.innerHTML = '<div class="ft-empty">' + icon("packageOpen", 34) + "<h3>Noch keine Spulen erfasst</h3>" +
        "<p>Leg deine erste Filamentspule an.</p>" +

      return;

      host.innerHTML = '<div class="ft-empty">' + icon("packageOpen", 34) + "<h3>Keine Treffer</h3><p>Passe Suche oder Filter an.</p></div>";
      return;

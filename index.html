  /* ------------------------------------------------------------------ *
   * Pick-or-create Widget (Material / Hersteller / Verpackung / Lagerort)
   * ------------------------------------------------------------------ */
  function renderTagPicker(containerId, kind, options, selected, addOpenFlag) {
    var host = document.getElementById(containerId);
    if (!host) return;
    var paletteKey = pickPaletteKeyByKind[kind];
    var archivedList = state.palette.archived[paletteKey] || [];
    var visible = options.filter(function (opt) { return archivedList.indexOf(opt) === -1 || opt === selected; });
    var chips = visible.map(function (opt) {
      var active = opt === selected;
      return '<span class="ft-pick-chip-wrap' + (active ? " active" : "") + '">' +
        '<button type="button" class="ft-pick-chip-inner" data-action="pick-select" data-kind="' + kind + '" data-value="' + esc(opt) + '">' + esc(opt) + "</button>" +
        '<button type="button" class="ft-pick-chip-del" data-action="pick-delete-ask" data-kind="' + kind + '" data-value="' + esc(opt) + '" aria-label="' + esc(opt) + ' entfernen" title="Entfernen">' + icon("x", 11) + "</button></span>";
    }).join("");
    var addUi = ui[addOpenFlag]
      ? '<div class="ft-pick-form"><input type="text" id="pick-input-' + kind + '" placeholder="Neuer Wert…" />' +
        '<button type="button" class="ft-iconbtn" data-action="pick-confirm" data-kind="' + kind + '" aria-label="Hinzufügen">' + icon("check", 14) + "</button>" +
        '<button type="button" class="ft-iconbtn" data-action="pick-cancel" data-kind="' + kind + '" aria-label="Abbrechen">' + icon("x", 14) + "</button></div>"
      : '<button type="button" class="ft-pick-add" data-action="pick-open" data-kind="' + kind + '">' + icon("plus", 13) + " Neu</button>";
    var offen = !!ui.pickExpanded[kind];
    host.innerHTML =
      '<div class="ft-pick-list" id="pick-list-' + kind + '">' + chips + addUi + "</div>" +
      '<button type="button" class="ft-pick-more" data-action="pick-more" data-kind="' + kind + '" hidden></button>';

    /* Die Hoehe der ersten drei Reihen wird ausgemessen statt geraten -
       so bleibt es richtig, auch wenn sich Schriftgroesse oder Abstaende
       aendern. Gemessen wird vor dem Zuklappen, sonst waere schon alles
       abgeschnitten. */
    var liste = document.getElementById("pick-list-" + kind);
    var mehr = host.querySelector(".ft-pick-more");
    var reihen = [];
    Array.prototype.forEach.call(liste.children, function (el) {
      if (reihen.indexOf(el.offsetTop) === -1) reihen.push(el.offsetTop);
    });
    if (reihen.length > 3) {
      mehr.hidden = false;
      if (offen) {
        mehr.textContent = "Weniger anzeigen";
      } else {
        liste.style.maxHeight = (reihen[3] - reihen[0] - 3) + "px";
        liste.classList.add("collapsed");
        mehr.textContent = "Alle " + visible.length + " anzeigen";
      }
    }
    if (ui[addOpenFlag]) {
      var inp = document.getElementById("pick-input-" + kind);
      inp.focus();
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); confirmPick(kind); }
        if (e.key === "Escape") { e.preventDefault(); cancelPick(kind); }
      });
    }
  }

  var pickFlagByKind = { material: "materialAddOpen", hersteller: "herstellerAddOpen", verpackung: "verpackungAddOpen", lagerort: "lagerortAddOpen" };
  var pickHostByKind = { material: "pick-material", hersteller: "pick-hersteller", verpackung: "pick-verpackung", lagerort: "pick-lagerort" };
  var pickPaletteKeyByKind = { material: "materials", hersteller: "hersteller", verpackung: "verpackungen", lagerort: "lagerorte" };

  function renderPicker(kind) {
    renderTagPicker(pickHostByKind[kind], kind, state.palette[pickPaletteKeyByKind[kind]], draft[kind], pickFlagByKind[kind]);
  }
  function renderAllPickers() {
    renderPicker("material"); renderPicker("hersteller"); renderPicker("verpackung"); renderPicker("lagerort");

  function confirmPick(kind) {

  /* ------------------------------------------------------------------ *
   * Farb-Auswahl: Gitter / Spektrum / Regler (synchron auf picker.hex)
   * ------------------------------------------------------------------ */
  var picker = null; // { tab, hex, name, translucent, glow }

  function resetPicker() {
    var existing = draft.farbe ? findColor(draft.farbe) : null;
    picker = {
      tab: null,           // null = eingeklappt; "gitter" | "spektrum" | "regler" wenn geöffnet
      hex: existing ? existing.hex : "#000000",
      name: draft.farbe || "",
      translucent: existing ? !!existing.translucent : false,
      glow: existing ? !!existing.glow : false
    };
  }

  // Grundfarbtöne des Referenz-Farbkreises (Gelb, Orange, Rot, Violett, Blau, Grün —
  // Reihenfolge und Farbwerte wie im vom Nutzer bereitgestellten Farbkreis-Bild).
  var WHEEL_HUES = [57, 32, 0, 284, 209, 157];
  function buildHueGrid() {
    var cells = [];
    [250, 225, 200, 175, 150, 125, 100, 75, 50, 25, 10, 0].forEach(function (v) { cells.push(rgbToHex(v, v, v)); });
    var hues = [];
    WHEEL_HUES.forEach(function (h) { hues.push((h + 354) % 360, (h + 6) % 360); });
    [88, 72, 56, 40, 26].forEach(function (l) {
      hues.forEach(function (h) {
        var rgb = hslToRgb(h, 80, l);
        cells.push(rgbToHex(rgb.r, rgb.g, rgb.b));
      });
    });
    return cells;
  }

  function previewFillStyle(name, hex, translucent) {
    if (isMultiColor(name)) return "background:" + rainbowCssGradient() + ";";
    return "background:" + hex + ";" + (translucent ? "opacity:.62;" : "");
  }

  function renderColorField() {
    renderColorHeader();
    renderSavedColors();
    renderColorTabs();
    renderColorBody();

  function renderColorHeader() {
    var host = document.getElementById("cp-header");
    if (!host) return;
    host.innerHTML =
      '<div class="ft-cp-preview" style="' + previewFillStyle(picker.name, picker.hex, picker.translucent) + '"></div>' +
      '<div class="ft-cp-headerinfo">' +
      '<input type="text" id="cp-name" class="ft-cp-name" placeholder="Farbname" value="' + esc(picker.name) + '" />' +
      '<div class="ft-cp-mods">' +
      '<button type="button" class="ft-modtoggle' + (picker.translucent ? " active" : "") + '" data-action="toggle-mod" data-mod="translucent">' + icon("ghost", 13) + " Transparent</button>" +
      '<button type="button" class="ft-modtoggle' + (picker.glow ? " active" : "") + '" data-action="toggle-mod" data-mod="glow">' + icon("bulb", 13) + " Leuchtend</button>" +
      "</div></div>" +
      '<button type="button" class="ft-btn ft-btn-primary ft-btn-sm" data-action="apply-color">' + icon("check", 14) + " Übernehmen</button>";
    document.getElementById("cp-name").addEventListener("input", function (e) { picker.name = e.target.value; });
  }
  function renderColorHeaderPreviewOnly() {
    var el = document.querySelector(".ft-cp-preview");

  function renderColorTabs() {
    var host = document.getElementById("cp-tabbar");
    if (!host) return;
    var tabs = [["gitter", "Gitter"], ["spektrum", "Spektrum"], ["regler", "Regler"]];
    host.innerHTML = tabs.map(function (t) {
      return '<button type="button" class="ft-cp-tab' + (picker.tab === t[0] ? " active" : "") + '" data-action="cp-tab" data-tab="' + t[0] + '" aria-expanded="' + (picker.tab === t[0] ? "true" : "false") + '">' + t[1] + "</button>";
    }).join("");

  function renderColorBody() {
    var host = document.getElementById("cp-body");
    if (!host) return;
    if (!picker.tab) { host.innerHTML = ""; return; }
    if (picker.tab === "gitter") { host.innerHTML = gitterTabHtml(); }
    else if (picker.tab === "spektrum") { host.innerHTML = spektrumTabHtml(); wireSpektrumTab(); }
    else { host.innerHTML = reglerTabHtml(); wireReglerTab(); }
  }

  function renderSavedColors() {
    var host = document.getElementById("cp-savedwrap");
    if (!host) return;
    var currentName = picker.name.trim().toLowerCase();
    var visibleColors = state.palette.colors.filter(function (c) { return !c.archived || c.name.toLowerCase() === currentName; });
    var saved = visibleColors.map(function (c) {
      var active = currentName === c.name.toLowerCase();
      var badges = (c.translucent || c.glow)
        ? '<span class="ft-cp-swatchbadges">' + (c.translucent ? icon("ghost", 9, "ft-badge-ghost") : "") + (c.glow ? icon("bulb", 9, "ft-badge-bulb") : "") + "</span>"
        : "";
      return '<div class="ft-cp-swatchwrap" draggable="true" data-color-name="' + esc(c.name) + '">' +
        '<button type="button" class="ft-swatchbtn' + (active ? " active" : "") + '" style="' + previewFillStyle(c.name, c.hex, c.translucent) + '" data-action="select-saved-color" data-value="' + esc(c.name) + '" title="' + esc(c.name) + '"></button>' +
        '<button type="button" class="ft-cp-swatchdelbtn" data-action="color-delete-ask" data-value="' + esc(c.name) + '" aria-label="' + esc(c.name) + ' löschen" title="Löschen">' + icon("trash", 10) + "</button>" +
        badges + "</div>";
    }).join("");
    host.innerHTML =
      '<div class="ft-cp-section-label">Gespeicherte Farben <span class="ft-cp-hint">— zum Sortieren ziehen</span></div>' +
      '<div class="ft-cp-saved" id="cp-saved">' + saved + "</div>";
    wireSavedColors();

  function wireSavedColors() {
    var container = document.getElementById("cp-saved");
    if (!container) return;
    var dragName = null;
    Array.prototype.forEach.call(container.querySelectorAll(".ft-cp-swatchwrap"), function (el) {
      el.addEventListener("dragstart", function (e) {
        dragName = el.dataset.colorName;
        el.classList.add("dragging");
        if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragName); } catch (err) { /* noop */ } }
      });
      el.addEventListener("dragend", function () { el.classList.remove("dragging"); });
      el.addEventListener("dragover", function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "move"; });
      el.addEventListener("drop", function (e) {
        e.preventDefault();
        var from = dragName || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
        var to = el.dataset.colorName;
        if (from && to && from !== to) { reorderPaletteColors(from, to); renderColorBody(); }
      });
    });
  }

  function onConfirmClick(e) {
    var t = e.target.closest("[data-action]");
    if (!t) {
      return;
    }
    switch (t.dataset.action) {
      case "confirm-overlay":
        if (e.target === t) { ui.colorDeleteConfirm = null; ui.pickDeleteConfirm = null; ui.materialInfoOpen = null; renderDeleteConfirm(); }
        break;
      case "material-info-close": ui.materialInfoOpen = null; renderDeleteConfirm(); break;
      case "color-delete-no": ui.colorDeleteConfirm = null; renderDeleteConfirm(); break;
      case "color-delete-yes": {
        var colorToDelete = t.dataset.value;
        ui.colorDeleteConfirm = null;
        renderDeleteConfirm();
        archiveColor(colorToDelete);
        renderColorField();
        pushToast("„" + colorToDelete + "“ aus der Farbauswahl entfernt");
        break;
      }
      case "pick-delete-no": ui.pickDeleteConfirm = null; renderDeleteConfirm(); break;
      case "pick-delete-yes": {
        var delKind = t.dataset.kind, delValue = t.dataset.value;
        ui.pickDeleteConfirm = null;
        renderDeleteConfirm();
        archivePaletteValue(pickPaletteKeyByKind[delKind], delValue);
        renderAllPickers();
        pushToast("„" + delValue + "“ aus der Auswahl entfernt");
        break;
      }
    }
  }

  function gitterTabHtml() {
    var cells = buildHueGrid();
    return '<div class="ft-cp-section-label">Farbtöne</div>' +
      '<div class="ft-cp-huegrid">' + cells.map(function (hex) {
        var activeCell = picker.hex.toLowerCase() === hex.toLowerCase();
        return '<button type="button" class="ft-cp-huecell' + (activeCell ? " active" : "") + '" style="background:' + hex + ';" data-action="select-hue" data-value="' + hex + '" title="' + hex + '"></button>';
      }).join("") + "</div>";
  }

  function spektrumTabHtml() {
    var rgb = hexToRgb(picker.hex);
    var hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
    return '<div class="ft-cp-spectrum">' +
      '<div class="ft-cp-svsquare" id="cp-svsquare" style="background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(' + hsv.h.toFixed(0) + ',100%,50%));">' +
      '<div class="ft-cp-svcursor" id="cp-svcursor" style="left:' + (hsv.s * 100) + '%;top:' + ((1 - hsv.v) * 100) + '%;"></div>' +
      "</div>" +
      '<input type="range" min="0" max="359" step="1" id="cp-hue-range" class="ft-cp-hueslider" value="' + Math.round(hsv.h) + '">' +
      "</div>";
  }
  function wireSpektrumTab() {
    var square = document.getElementById("cp-svsquare");
    var cursor = document.getElementById("cp-svcursor");
    var hueRange = document.getElementById("cp-hue-range");
    if (!square) return;
    function setFromPointer(clientX, clientY) {
      var rect = square.getBoundingClientRect();
      var x = clamp((clientX - rect.left) / rect.width, 0, 1);
      var y = clamp((clientY - rect.top) / rect.height, 0, 1);
      var hue = Number(hueRange.value);
      var rgb = hsvToRgb(hue, x, 1 - y);
      picker.hex = rgbToHex(rgb.r, rgb.g, rgb.b);
      cursor.style.left = (x * 100) + "%";
      cursor.style.top = (y * 100) + "%";
      renderColorHeaderPreviewOnly();
    }
    var dragging = false;
    square.addEventListener("pointerdown", function (e) { dragging = true; try { square.setPointerCapture(e.pointerId); } catch (err) { /* noop */ } setFromPointer(e.clientX, e.clientY); });
    square.addEventListener("pointermove", function (e) { if (dragging) setFromPointer(e.clientX, e.clientY); });
    square.addEventListener("pointerup", function (e) { dragging = false; try { square.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ } });
    hueRange.addEventListener("input", function () {
      square.style.background = "linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(" + hueRange.value + ",100%,50%))";
      var leftPct = (parseFloat(cursor.style.left) || 0) / 100;
      var topPct = (parseFloat(cursor.style.top) || 0) / 100;
      var rgb = hsvToRgb(Number(hueRange.value), leftPct, 1 - topPct);
      picker.hex = rgbToHex(rgb.r, rgb.g, rgb.b);
      renderColorHeaderPreviewOnly();
    });
  }

  function reglerTabHtml() {
    var rgb = hexToRgb(picker.hex);
    function row(label, key, val) {
      return '<div class="ft-cp-slider-row"><span class="ft-cp-slider-label">' + label + '</span>' +
        '<input type="range" min="0" max="255" id="cp-' + key + '-range" class="ft-cp-slider" value="' + val + '">' +
        '<input type="number" min="0" max="255" id="cp-' + key + '-num" class="ft-cp-slider-num ft-mono" value="' + val + '"></div>';
    }
    return '<div class="ft-cp-sliders">' + row("Rot", "r", rgb.r) + row("Grün", "g", rgb.g) + row("Blau", "b", rgb.b) + "</div>" +
      '<div class="ft-cp-hexrow"><span>sRGB Hex-Farbe #</span><input type="text" id="cp-hex-input" class="ft-mono" maxlength="7" value="' + picker.hex.replace("#", "") + '"></div>';
  }
  function updateSliderGradients() {
    var rgb = hexToRgb(picker.hex);
    var rEl = document.getElementById("cp-r-range");
    var gEl = document.getElementById("cp-g-range");
    var bEl = document.getElementById("cp-b-range");
    if (rEl) rEl.style.background = "linear-gradient(to right," + rgbToHex(0, rgb.g, rgb.b) + "," + rgbToHex(255, rgb.g, rgb.b) + ")";
    if (gEl) gEl.style.background = "linear-gradient(to right," + rgbToHex(rgb.r, 0, rgb.b) + "," + rgbToHex(rgb.r, 255, rgb.b) + ")";
    if (bEl) bEl.style.background = "linear-gradient(to right," + rgbToHex(rgb.r, rgb.g, 0) + "," + rgbToHex(rgb.r, rgb.g, 255) + ")";
  }
  function wireReglerTab() {
    ["r", "g", "b"].forEach(function (key) {
      var range = document.getElementById("cp-" + key + "-range");
      var num = document.getElementById("cp-" + key + "-num");
      function apply(val) {
        var rgb = hexToRgb(picker.hex);
        rgb[key] = clampByte(val);
        picker.hex = rgbToHex(rgb.r, rgb.g, rgb.b);
        range.value = rgb[key]; num.value = rgb[key];
        renderColorHeaderPreviewOnly();
        updateSliderGradients();
        var hexEl = document.getElementById("cp-hex-input");
        if (hexEl) hexEl.value = picker.hex.replace("#", "");
      }
      range.addEventListener("input", function () { apply(range.value); });
      num.addEventListener("input", function () { apply(num.value); });
    });
    var hexInput = document.getElementById("cp-hex-input");
    hexInput.addEventListener("change", function () {
      var v = hexInput.value.trim().replace("#", "");
      if (/^[0-9a-fA-F]{6}$/.test(v)) { picker.hex = ("#" + v).toUpperCase(); renderColorHeaderPreviewOnly(); renderColorBody(); }
    });
    updateSliderGradients();
  }

  function fallbackCsvDownload(csv, filename) {

  function todayStamp() {

  /* ------------------------------------------------------------------ *
   * Excel (.xlsx) Export / Import
   * Die SheetJS-Bibliothek wird bei Bedarf per JS dynamisch nachgeladen
   * (kein statisches <script>-Tag im HEAD_TEMPLATE, damit die Quine-
   * Selbstrekonstruktion keine schliessende Script-Tag-Sequenz einschleust).
   * ------------------------------------------------------------------ */
  var xlsxLoadPromise = null;
  function ensureXlsxLib() {
    if (typeof window.XLSX !== "undefined") return Promise.resolve(window.XLSX);
    if (xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = function () {
        if (typeof window.XLSX !== "undefined") resolve(window.XLSX);
        else reject(new Error("XLSX nach dem Laden nicht verfügbar"));
      };
      s.onerror = function () { xlsxLoadPromise = null; reject(new Error("Laden der Excel-Bibliothek fehlgeschlagen")); };
      document.head.appendChild(s);
    });
    return xlsxLoadPromise;
  }

  function buildWorkbookBlob() {
    var X = window.XLSX;
    var wb = X.utils.book_new();

    var spoolRows = state.spools.map(function (s) {
      return {
        "ID": s.id, "Farbe": s.farbe, "Material": s.material, "Hersteller": s.hersteller,
        "Gewicht aktuell (g)": s.gewichtAktuell, "Gewicht neu (g)": s.gewichtNeu,
        "Netto Filament (g)": getNetto(s), "Restbestand (%)": Math.round(getRestbestand(s) * 100),
        "Kaufdatum": s.kaufdatum, "Verpackung": s.verpackung, "Lagerort": s.lagerort,
        "Status": STATUS_META[getStatus(s)].label, "Notizen": s.notizen
      };
    });
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(spoolRows), "Spulen");

    var colorRows = state.palette.colors.map(function (c) {
      return { "Name": c.name, "Hex": c.hex, "Transparent": c.translucent ? "Ja" : "Nein", "Leuchtend": c.glow ? "Ja" : "Nein", "Archiviert": c.archived ? "Ja" : "Nein" };
    });
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(colorRows), "Farben");

    [["materials", "Materialien"], ["hersteller", "Hersteller"], ["verpackungen", "Verpackungen"], ["lagerorte", "Lagerorte"]].forEach(function (pair) {
      var kind = pair[0];
      var archivedList = state.palette.archived[kind] || [];
      var rows = state.palette[kind].map(function (name) {
        return { "Name": name, "Archiviert": archivedList.indexOf(name) !== -1 ? "Ja" : "Nein" };
      });
      X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows), pair[1]);
    });

    var arr = X.write(wb, { bookType: "xlsx", type: "array" });
    return new Blob([arr], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  function exportXLSX() {
    pushToast("Excel-Datei wird vorbereitet…");
    ensureXlsxLib().then(function () {
      var blob;
      try { blob = buildWorkbookBlob(); } catch (e) { pushToast("Excel-Export fehlgeschlagen.", "danger"); return; }
      var filename = "filament-lager-" + todayStamp() + ".xlsx";
      var inHostedFrame = (typeof window.claude !== "undefined" && window.claude && typeof window.claude.use === "function");
      if (!inHostedFrame) { fallbackBlobDownload(blob, filename, "Excel-Datei exportiert"); return; }
      downloadsReady.then(function (api) {
        if (!api) { pushToast("Excel-Export ist in dieser Ansicht nicht verfügbar.", "danger"); return; }
        api.save({ filename: filename, data: blob }).then(function () {
          pushToast("Excel-Datei heruntergeladen");
        }).catch(function (err) {
          if (err && err.code === "declined") return;
          pushToast("Excel-Export wird in dieser gehosteten Ansicht nicht unterstützt — bitte die heruntergeladene HTML-Datei lokal öffnen und dort erneut exportieren.", "danger");
        });
      });
    }).catch(function () {
      pushToast("Excel-Bibliothek konnte nicht geladen werden (Internetverbindung prüfen).", "danger");
    });
  }

  function sheetRows(wb, name) {
    var ws = wb.Sheets[name];
    if (!ws) return null;
    return window.XLSX.utils.sheet_to_json(ws, { defval: "" });
  }

  function parseWorkbookToState(wb) {
    var spoolRows = sheetRows(wb, "Spulen");
    if (!spoolRows) return null;

    var spools = spoolRows.map(function (r) {
      return {
        id: (r["ID"] && String(r["ID"]).trim()) || uid(),
        farbe: String(r["Farbe"] || "").trim(),
        material: String(r["Material"] || "").trim(),
        hersteller: String(r["Hersteller"] || "").trim(),
        gewichtAktuell: Number(r["Gewicht aktuell (g)"]) || 0,
        gewichtNeu: Number(r["Gewicht neu (g)"]) || 0,
        verpackung: String(r["Verpackung"] || "").trim(),
        kaufdatum: String(r["Kaufdatum"] || "").trim(),
        lagerort: String(r["Lagerort"] || "").trim(),
        notizen: String(r["Notizen"] || "")
      };
    }).filter(function (s) { return s.farbe && s.material && s.hersteller; });

    var colorRows = sheetRows(wb, "Farben") || [];
    var colors = colorRows.map(function (r) {
      return {
        name: String(r["Name"] || "").trim(),
        hex: String(r["Hex"] || "").trim() || "#8A8272",
        translucent: String(r["Transparent"] || r["Transluzent"] || "").trim().toLowerCase() === "ja",
        glow: String(r["Leuchtend"] || "").trim().toLowerCase() === "ja",
        archived: String(r["Archiviert"] || "").trim().toLowerCase() === "ja"
      };
    }).filter(function (c) { return c.name; });

    var palette = { colors: colors, materials: [], hersteller: [], verpackungen: [], lagerorte: [], archived: { materials: [], hersteller: [], verpackungen: [], lagerorte: [] } };
    [["Materialien", "materials"], ["Hersteller", "hersteller"], ["Verpackungen", "verpackungen"], ["Lagerorte", "lagerorte"]].forEach(function (pair) {
      var rows = sheetRows(wb, pair[0]) || [];
      rows.forEach(function (r) {
        var name = String(r["Name"] || "").trim();
        if (!name) return;
        palette[pair[1]].push(name);
        if (String(r["Archiviert"] || "").trim().toLowerCase() === "ja") palette.archived[pair[1]].push(name);
      });
    });

    var counts = {
      spools: spools.length, colors: colors.length, materials: palette.materials.length,
      hersteller: palette.hersteller.length, verpackungen: palette.verpackungen.length, lagerorte: palette.lagerorte.length
    };
    return { spools: spools, palette: palette, counts: counts };
  }

  function handleImportFile(file) {
    ensureXlsxLib().then(function (XLSXlib) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var candidate;
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSXlib.read(data, { type: "array" });
          candidate = parseWorkbookToState(wb);
        } catch (err) { candidate = null; }
        if (!candidate) { pushToast("Die Datei enthält keine erkennbaren Filament-Lager-Daten.", "danger"); return; }
        ui.importDialog = candidate;
        renderImportDialog();
      };
      reader.onerror = function () { pushToast("Import fehlgeschlagen: Datei konnte nicht gelesen werden.", "danger"); };
      reader.readAsArrayBuffer(file);
    }).catch(function () {
      pushToast("Excel-Bibliothek konnte nicht geladen werden (Internetverbindung prüfen).", "danger");
    });
  }

  function parseCSVRows(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
        else field += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ";") { row.push(field); field = ""; }
        else if (ch === "\r") { /* ignore, \n handles the break */ }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else field += ch;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return !(r.length === 1 && r[0] === ""); });
  }

  function distinctNonEmptyCount(arr) {
    var seen = {};
    arr.forEach(function (v) { if (v) seen[v.toLowerCase()] = true; });
    return Object.keys(seen).length;
  }

  function parseCSVToState(text) {
    var rows = parseCSVRows(text);
    if (rows.length < 1) return null;
    var header = rows[0].map(function (h) { return h.trim(); });
    var idx = {};
    header.forEach(function (h, i) { idx[h] = i; });
    if (!("Farbe" in idx) || !("Material" in idx) || !("Hersteller" in idx)) return null;

    function get(r, name) { return idx.hasOwnProperty(name) ? (r[idx[name]] || "") : ""; }
    var spools = rows.slice(1).map(function (r) {
      return {
        id: uid(),
        farbe: String(get(r, "Farbe")).trim(),
        material: String(get(r, "Material")).trim(),
        hersteller: String(get(r, "Hersteller")).trim(),
        gewichtAktuell: Number(get(r, "Gewicht aktuell (g)")) || 0,
        gewichtNeu: Number(get(r, "Gewicht neu (g)")) || 0,
        verpackung: String(get(r, "Verpackung")).trim(),
        kaufdatum: String(get(r, "Kaufdatum")).trim(),
        lagerort: String(get(r, "Lagerort")).trim(),
        notizen: String(get(r, "Notizen") || "")
      };
    }).filter(function (s) { return s.farbe && s.material && s.hersteller; });

    // CSV enthält keine separate Paletten-Tabelle — bestehende Palette klonen
    // und alle in der Datei referenzierten, noch unbekannten Werte ergänzen,
    // damit nichts Bestehendes verändert oder gelöscht wird.
    var palette = JSON.parse(JSON.stringify(state.palette));
    function ensureValue(kind, name) {
      if (!name) return;
      var exists = palette[kind].some(function (x) { return x.toLowerCase() === name.toLowerCase(); });
      if (!exists) palette[kind].push(name);
    }
    spools.forEach(function (s) {
      ensureValue("materials", s.material);
      ensureValue("hersteller", s.hersteller);
      ensureValue("verpackungen", s.verpackung);
      ensureValue("lagerorte", s.lagerort);
      if (s.farbe && !palette.colors.some(function (c) { return c.name.toLowerCase() === s.farbe.toLowerCase(); })) {
        palette.colors.push({ name: s.farbe, hex: "#8A8272", translucent: false, glow: false, archived: false });
      }
    });

    var counts = {
      spools: spools.length,
      colors: distinctNonEmptyCount(spools.map(function (s) { return s.farbe; })),
      materials: distinctNonEmptyCount(spools.map(function (s) { return s.material; })),
      hersteller: distinctNonEmptyCount(spools.map(function (s) { return s.hersteller; })),
      verpackungen: distinctNonEmptyCount(spools.map(function (s) { return s.verpackung; })),
      lagerorte: distinctNonEmptyCount(spools.map(function (s) { return s.lagerort; }))
    };
    return { spools: spools, palette: palette, counts: counts };
  }

  function handleImportFileCSV(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var candidate;
      try { candidate = parseCSVToState(String(e.target.result)); } catch (err) { candidate = null; }
      if (!candidate) { pushToast("Die CSV-Datei enthält keine erkennbaren Filament-Lager-Daten.", "danger"); return; }
      ui.importDialog = candidate;
      renderImportDialog();
    };
    reader.onerror = function () { pushToast("Import fehlgeschlagen: Datei konnte nicht gelesen werden.", "danger"); };
    reader.readAsText(file, "utf-8");
  }

  function spoolSignature(s) {
    return [s.farbe, s.material, s.hersteller, s.gewichtAktuell, s.gewichtNeu, s.verpackung, s.kaufdatum, s.lagerort, s.notizen].join("||");
  }

  function closeImportDialog() { ui.importDialog = null; var h = document.getElementById("import-root"); if (h) h.innerHTML = ""; }

  function applyImportTake() {
    var d = ui.importDialog;
    if (!d) return;
    state.spools = d.spools.map(function (s) { return Object.assign({}, s, { id: s.id || uid() }); });
    state.palette = normalizeState({ palette: d.palette }).palette;
    var n = d.counts.spools;
    closeImportDialog();
    persist(); renderAll();
    pushToast("Import abgeschlossen — bestehende Daten ersetzt (" + n + " Spule(n)).");
  }

  function applyImportMerge() {
    var d = ui.importDialog;
    if (!d) return;
    var addedSpools = 0, skippedDup = 0;
    var existingSig = state.spools.map(spoolSignature);
    d.spools.forEach(function (s) {
      var sig = spoolSignature(s);
      if (existingSig.indexOf(sig) !== -1) { skippedDup++; return; }
      state.spools.push(Object.assign({}, s, { id: uid() }));
      existingSig.push(sig);
      addedSpools++;
    });

    ["materials", "hersteller", "verpackungen", "lagerorte"].forEach(function (kind) {
      (d.palette[kind] || []).forEach(function (name) {
        var exists = state.palette[kind].some(function (x) { return x.toLowerCase() === name.toLowerCase(); });
        if (!exists) state.palette[kind].push(name);
      });
    });
    (d.palette.colors || []).forEach(function (c) {
      if (!findColor(c.name)) state.palette.colors.push({ name: c.name, hex: c.hex, translucent: c.translucent, glow: c.glow, archived: false });
    });

    closeImportDialog();
    persist(); renderAll();
    pushToast("Zusammengeführt: " + addedSpools + " neue Spule(n) hinzugefügt" + (skippedDup ? ", " + skippedDup + " Duplikat(e) übersprungen" : "") + ".");
  }

  function onImportClick(e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    switch (t.dataset.action) {
      case "import-overlay": if (e.target === t) closeImportDialog(); break;
      case "import-cancel": closeImportDialog(); break;
      case "import-keep": closeImportDialog(); pushToast("Bestehende Daten behalten — nichts importiert."); break;
      case "import-take": applyImportTake(); break;
      case "import-merge": applyImportMerge(); break;
    }
  }

      "</div></div></div>";
  }

    if (t.dataset.action === "settings-close") closeSettings();
    if (t.dataset.action === "settings-overlay" && e.target === t) closeSettings();
    if (t.dataset.action === "sync-pull-now") { closeSettings(); syncPull(); }
    if (t.dataset.action === "sync-push-now") { closeSettings(); syncPush(true); }
    if (t.dataset.action === "sync-logout") {
      clearPass();
      sync.pass = null; sync.rev = -1; sync.conflict = null; sync.gateError = "";
      resetToEmptyState();
      renderSyncBar(); closeSettings();
      sync.status = "locked"; renderSyncPill(); renderGate();
    }
  }

  /* ------------------------------------------------------------------ *
   * Diagramm — Verlauf für "Spulen gesamt" / "Nettogewicht gesamt"
   * ------------------------------------------------------------------ */
  function formatHistoryDate(d) {
    var parts = String(d).split("-");
    var day = parseInt(parts[2], 10);
    var month = MONTHS[parseInt(parts[1], 10) - 1] || "";
    return day + ". " + month;
  }
  /* Nur das Geruest. Die Pfade selbst zeichnet wireChart, weil sich der
     sichtbare Zeitraum per Mausrad jederzeit aendern kann. */
  function buildChartSkeleton(color) {
    var w = 400, h = 150, padT = 10, padB = 10;
    return '<svg viewBox="0 0 ' + w + " " + h + '" class="ft-chart-svg">' +
      '<defs><clipPath id="ft-chart-clip"><rect x="0" y="0" width="' + w + '" height="' + h + '"/></clipPath></defs>' +
      '<g clip-path="url(#ft-chart-clip)">' +
      '<path class="ft-chart-area" d="" fill="' + color + '" opacity="0.14" stroke="none"/>' +
      '<line class="ft-chart-guide" x1="0" y1="' + padT + '" x2="0" y2="' + (h - padB) + '"/>' +
      '<path class="ft-chart-line" d="" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<g class="ft-chart-dots"></g>' +
      '<circle class="ft-chart-hl" r="5.5" fill="' + color + '" stroke="var(--surface)" stroke-width="2"/>' +
      "</g></svg>";
  }

  function openChart(metric) { ui.chartOpen = metric; renderChart(); }
  function closeChart() { ui.chartOpen = null; var h = document.getElementById("chart-root"); if (h) h.innerHTML = ""; }
  function renderChart() {
    var host = document.getElementById("chart-root");
    if (!host) return;
    if (!ui.chartOpen) { host.innerHTML = ""; return; }
    var metric = ui.chartOpen;
    var isSpools = metric === "spools";
    var title = isSpools ? "Verlauf — Spulen gesamt" : "Verlauf — Nettogewicht gesamt";
    var unit = isSpools ? " Spule(n)" : " kg";
    var history = state.history || [];
    var values = history.map(function (h) { return isSpools ? h.spoolCount : h.totalNetto / 1000; });
    var fmt = function (v) { return isSpools ? String(Math.round(v)) : v.toLocaleString("de-DE", { maximumFractionDigits: 1 }); };
    var currentVal = values.length ? values[values.length - 1] : (isSpools ? state.spools.length : computeStats().totalNetto / 1000);
    var body;
    if (values.length < 2) {
      body = '<p class="ft-chart-empty">Noch nicht genug Verlaufsdaten für ein Diagramm — ab morgen zeigt sich hier die Entwicklung. Aktueller Wert: <strong class="ft-mono">' + fmt(currentVal) + unit + "</strong>.</p>";
    } else {
      var color = isSpools ? "#3E7CB1" : "#43A047";
      var svg = buildChartSkeleton(color);
      var delta = values[values.length - 1] - values[0];
      var trendIcon = delta > 0.0001 ? icon("trendUp", 14) : delta < -0.0001 ? icon("trendDown", 14) : "";
      var trendClass = delta > 0.0001 ? "ft-chart-up" : delta < -0.0001 ? "ft-chart-down" : "ft-chart-flat";
      var sign = delta > 0 ? "+" : "";
      body = '<div class="ft-chart-wrap">' + svg + '<div class="ft-chart-range"></div>' +
        '<div class="ft-chart-tip"></div></div>' + '<p class="ft-chart-hint"></p>' +
        '<div class="ft-chart-summary">' +
        '<div class="ft-chart-current">Aktuell: <strong class="ft-mono">' + fmt(currentVal) + unit + "</strong></div>" +
        '<div class="ft-chart-delta ' + trendClass + '">' + trendIcon + " " + sign + fmt(delta) + unit + " seit " + formatHistoryDate(history[0].date) + "</div>" +
        "</div>";
    }
    host.innerHTML =
      '<div class="ft-overlay" data-action="chart-overlay">' +
      '<div class="ft-modal ft-modal-sm">' +
      '<div class="ft-modal-head"><h2>' + title + "</h2>" +
      '<button type="button" class="ft-iconbtn" data-action="chart-close">' + icon("x", 18) + "</button></div>" +
      '<div class="ft-modal-body">' + body + "</div>" +
      "</div></div>";

    if (values.length >= 2) wireChart(history, values, fmt, unit, color);
  }

  /* Diagramm-Interaktion: genauen Wert beim Ueberfahren anzeigen und mit
     dem Mausrad den sichtbaren Zeitraum stufenlos zoomen. Doppelklick
     stellt den vollen Zeitraum wieder her. */
  function wireChart(history, values, fmt, unit, color) {
    var wrap = document.querySelector("#chart-root .ft-chart-wrap");
    if (!wrap) return;
    var svg = wrap.querySelector("svg");
    if (!svg) return;
    var area = svg.querySelector(".ft-chart-area");
    var line = svg.querySelector(".ft-chart-line");
    var dotsG = svg.querySelector(".ft-chart-dots");
    var guide = svg.querySelector(".ft-chart-guide");
    var hl = svg.querySelector(".ft-chart-hl");
    var tip = wrap.querySelector(".ft-chart-tip");
    var badge = wrap.querySelector(".ft-chart-range");
    var deltaEl = document.querySelector("#chart-root .ft-chart-delta");
    if (!area || !line || !dotsG || !guide || !hl || !tip) return;

    var W = 400, H = 150, padL = 6, padR = 6, padT = 10, padB = 10;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var n = values.length;
    if (n < 2) return;

    var MIN_FENSTER = Math.min(4, n);
    var fenster = n;          // sichtbare Punkte als Kommazahl -> stufenlos
    var startF = 0;
    var yLo = 0, yHi = 1, yLoZiel = 0, yHiZiel = 1;
    var letzterZeiger = null;
    var raf = null;

    function zielBereich() {
      startF = Math.max(0, n - fenster);
      var von = Math.floor(startF);
      var lo = Infinity, hi = -Infinity;
      for (var i = von; i < n; i++) {
        if (values[i] < lo) lo = values[i];
        if (values[i] > hi) hi = values[i];
      }
      if (lo === hi) { lo -= 1; hi += 1; }
      var luft = (hi - lo) * 0.10;
      yLoZiel = lo - luft;
      yHiZiel = hi + luft;
    }
    function px(i) { return padL + ((i - startF) / (fenster - 1)) * innerW; }
    function py(v) { return padT + innerH - ((v - yLo) / (yHi - yLo)) * innerH; }

    function zeichnen() {
      var von = Math.max(0, Math.floor(startF) - 1);
      var d = "", ersteX = 0, letzteX = 0;
      for (var i = von; i < n; i++) {
        var x = px(i), y = py(values[i]);
        if (i === von) { d = "M" + x.toFixed(1) + " " + y.toFixed(1); ersteX = x; }
        else { d += " L" + x.toFixed(1) + " " + y.toFixed(1); }
        letzteX = x;
      }
      line.setAttribute("d", d);
      area.setAttribute("d", d + " L" + letzteX.toFixed(1) + " " + (H - padB) +
                             " L" + ersteX.toFixed(1) + " " + (H - padB) + " Z");

      // Punkte ausduennen, damit es bei langen Zeitraeumen nicht zumatscht
      var schrittweite = Math.max(1, Math.ceil((n - von) / 45));
      var kreise = "";
      for (var k = von; k < n; k++) {
        var letzter = k === n - 1;
        if (!letzter && (n - 1 - k) % schrittweite !== 0) continue;
        kreise += '<circle cx="' + px(k).toFixed(1) + '" cy="' + py(values[k]).toFixed(1) +
          '" r="' + (letzter ? 4.5 : 2.5) + '" fill="' + color + '"' +
          (letzter ? ' stroke="var(--surface)" stroke-width="2"' : "") + "/>";
      }
      dotsG.innerHTML = kreise;

      if (badge) {
        var tage = Math.round(fenster);
        badge.textContent = tage >= n ? "alle " + n + " Tage" : "letzte " + tage + " Tage";
      }
      veraenderungAktualisieren();
    }

    // Die Zeile unter dem Diagramm soll denselben Zeitraum meinen wie die Kurve
    function veraenderungAktualisieren() {
      if (!deltaEl) return;
      var von = Math.ceil(startF);
      if (von > n - 1) von = n - 1;
      var diff = values[n - 1] - values[von];
      var klasse = diff > 0.0001 ? "ft-chart-up" : diff < -0.0001 ? "ft-chart-down" : "ft-chart-flat";
      var pfeil = diff > 0.0001 ? icon("trendUp", 14) : diff < -0.0001 ? icon("trendDown", 14) : "";
      deltaEl.className = "ft-chart-delta " + klasse;
      deltaEl.innerHTML = pfeil + " " + (diff > 0 ? "+" : "") + esc(fmt(diff) + unit) +
        " seit " + esc(formatHistoryDate(history[von].date));
    }

    // Die senkrechte Skala gleitet nach, statt beim Zoomen zu springen
    function nachziehen() {
      var spanne = Math.abs(yHiZiel - yLoZiel) || 1;
      var d1 = yLoZiel - yLo, d2 = yHiZiel - yHi;
      if (Math.abs(d1) > spanne * 0.0008 || Math.abs(d2) > spanne * 0.0008) {
        yLo += d1 * 0.25;
        yHi += d2 * 0.25;
        zeichnen();
        if (letzterZeiger) zeigen(letzterZeiger);
        raf = requestAnimationFrame(nachziehen);
      } else {
        yLo = yLoZiel; yHi = yHiZiel;
        zeichnen();
        if (letzterZeiger) zeigen(letzterZeiger);
        raf = null;
      }
    }
    function anstossen() { if (!raf) raf = requestAnimationFrame(nachziehen); }

    function zeigen(e) {
      var r = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      if (!r.width) return;
      letzterZeiger = { clientX: e.clientX, clientY: e.clientY };
      var vx = ((e.clientX - r.left) / r.width) * W;
      var i = Math.round(startF + ((vx - padL) / innerW) * (fenster - 1));
      var untereGrenze = Math.ceil(startF);
      if (i < untereGrenze) i = untereGrenze;
      if (i > n - 1) i = n - 1;

      var x = px(i), y = py(values[i]);
      guide.setAttribute("x1", x.toFixed(1));
      guide.setAttribute("x2", x.toFixed(1));
      guide.style.opacity = "1";
      hl.setAttribute("cx", x.toFixed(1));
      hl.setAttribute("cy", y.toFixed(1));
      hl.style.opacity = "1";

      tip.innerHTML =
        '<span class="ft-chart-tip-date">' + esc(formatHistoryDate(history[i].date)) + "</span>" +
        '<strong class="ft-mono">' + esc(fmt(values[i]) + unit) + "</strong>";

      var links = (r.left - wr.left) + (x / W) * r.width;
      var oben = (r.top - wr.top) + (y / H) * r.height;
      var halb = tip.offsetWidth / 2;
      if (links < halb + 2) links = halb + 2;
      if (links > wr.width - halb - 2) links = wr.width - halb - 2;
      tip.style.left = links.toFixed(1) + "px";
      tip.style.top = oben.toFixed(1) + "px";
      tip.style.transform = (y / H) < 0.36 ? "translate(-50%, 34%)" : "translate(-50%, -128%)";
      tip.style.opacity = "1";
    }
    function verbergen() {
      letzterZeiger = null;
      tip.style.opacity = "0";
      guide.style.opacity = "0";
      hl.style.opacity = "0";
    }

    wrap.addEventListener("wheel", function (e) {
      e.preventDefault();
      fensterSetzen(fenster * Math.exp(e.deltaY * 0.0015));
    }, { passive: false });

    wrap.addEventListener("dblclick", function () {
      if (fenster === n) return;
      fenster = n; zielBereich(); anstossen();
    });

    // Zwei-Finger-Geste: der Abstand der Finger steuert den Zeitraum
    var zeiger = {}, startAbstand = 0, startFenster = 0;
    function fingerZahl() { return Object.keys(zeiger).length; }
    function fingerAbstand() {
      var ids = Object.keys(zeiger);
      if (ids.length < 2) return 0;
      var a = zeiger[ids[0]], b = zeiger[ids[1]];
      var dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function fensterSetzen(neu) {
      if (neu < MIN_FENSTER) neu = MIN_FENSTER;
      if (neu > n) neu = n;
      if (neu === fenster) return;
      fenster = neu;
      zielBereich();
      anstossen();
    }

    wrap.addEventListener("pointerdown", function (e) {
      zeiger[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (fingerZahl() === 2) {
        startAbstand = fingerAbstand();
        startFenster = fenster;
        verbergen();
      } else if (fingerZahl() === 1) {
        zeigen(e);
      }
    });
    wrap.addEventListener("pointermove", function (e) {
      if (zeiger[e.pointerId]) zeiger[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (fingerZahl() >= 2) {
        var d = fingerAbstand();
        if (startAbstand > 0 && d > 0) fensterSetzen(startFenster * (startAbstand / d));
        return;
      }
      zeigen(e);
    });
    function fingerWeg(e) {
      delete zeiger[e.pointerId];
      if (fingerZahl() < 2) startAbstand = 0;
    }
    wrap.addEventListener("pointerup", fingerWeg);
    wrap.addEventListener("pointercancel", function (e) { fingerWeg(e); verbergen(); });
    wrap.addEventListener("pointerleave", function (e) { fingerWeg(e); verbergen(); });

    // Hinweis passend zum Eingabegeraet
    var hinweis = document.querySelector("#chart-root .ft-chart-hint");
    if (hinweis) {
      var grob = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      hinweis.textContent = grob
        ? "Zwei Finger zum Zoomen · doppelt tippen zeigt alles"
        : "Mausrad zum Zoomen · Doppelklick zeigt alles";
    }

    zielBereich();
    yLo = yLoZiel; yHi = yHiZiel;
    zeichnen();
  }


  function onChartClick(e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    if (t.dataset.action === "chart-close") closeChart();
    if (t.dataset.action === "chart-overlay" && e.target === t) closeChart();
  }

  /* ------------------------------------------------------------------ *
   * Event-Delegation
   * ------------------------------------------------------------------ */
  function onRootClick(e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.dataset.action;
    switch (action) {
      case "open-add": openAddModal(); break;
      case "toggle-export-menu": ui.exportMenuOpen = !ui.exportMenuOpen; renderExportMenu(); break;
      case "export-csv": ui.exportMenuOpen = false; renderExportMenu(); exportCSV(); break;
      case "export-xlsx": ui.exportMenuOpen = false; renderExportMenu(); exportXLSX(); break;
      case "import-xlsx": ui.exportMenuOpen = false; renderExportMenu(); document.getElementById("import-file-input").click(); break;
      case "import-csv": ui.exportMenuOpen = false; renderExportMenu(); document.getElementById("import-file-input-csv").click(); break;
      case "open-settings": openSettings(); break;
      case "sync-pill":
        if (sync.status === "locked") renderGate();
        else if (sync.status === "offline") syncTick();
        break;
      case "sync-take-server": resolveConflict(false); break;
      case "sync-keep-mine": resolveConflict(true); break;
      case "open-chart": openChart(t.dataset.metric); break;
      case "toggle-theme": toggleTheme(); break;
      case "edit-spool": {
        var spool = state.spools.find(function (s) { return s.id === t.dataset.id; });
        if (spool) openEditModal(spool);
        break;
      }
      case "confirm-delete": ui.confirmDeleteId = t.dataset.id; renderGrid(); break;
      case "cancel-delete": ui.confirmDeleteId = null; renderGrid(); break;
      case "do-delete": ui.confirmDeleteId = null; deleteSpool(t.dataset.id); break;
      case "toggle-color-filter": ui.filterColor = ui.filterColor === t.dataset.value ? null : t.dataset.value; renderColorPanel(); renderGrid(); break;
      case "toggle-material-filter": ui.filterMaterial = ui.filterMaterial === t.dataset.value ? null : t.dataset.value; renderMaterialPanel(); renderGrid(); break;
      case "toggle-status-filter": ui.filterStatus = ui.filterStatus === t.dataset.value ? null : t.dataset.value; renderStats(); renderGrid(); break;
      case "toggle-mod-filter": {
        var mk = t.dataset.value === "glow" ? "filterGlow" : "filterTranslucent";
        ui[mk] = !ui[mk];
        renderChips(); renderGrid();
        break;
      }
      case "reset-filters": ui.search = ""; ui.filterMaterial = null; ui.filterStatus = null; ui.filterColor = null;
        ui.filterTranslucent = false; ui.filterGlow = false;
        document.getElementById("search-input").value = ""; renderStats(); renderChips(); renderColorPanel(); renderGrid(); break;
      case "show-material-info": ui.materialInfoOpen = t.dataset.material; renderDeleteConfirm(); break;
    }
  }

  function onModalClick(e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.dataset.action;
    switch (action) {
      case "close-modal": closeModal(); break;
      case "overlay-close": if (e.target === t) closeModal(); break;
      case "pick-more": {
        var pk = t.dataset.kind;
        ui.pickExpanded[pk] = !ui.pickExpanded[pk];
        renderPicker(pk);
        break;
      }
      case "cp-tab": picker.tab = (picker.tab === t.dataset.tab) ? null : t.dataset.tab; renderColorTabs(); renderColorBody(); break;
      case "toggle-mod": {
        var modKey = t.dataset.mod;
        picker[modKey] = !picker[modKey];
        renderColorHeader();
        break;
      }
      case "select-saved-color": {
        var savedColor = findColor(t.dataset.value);
        if (savedColor) {
          picker.hex = savedColor.hex; picker.name = savedColor.name;
          picker.translucent = !!savedColor.translucent; picker.glow = !!savedColor.glow;
          draft.farbe = savedColor.name; clearFieldError("farbe");
          renderColorField();
        }
        break;
      }
      case "select-hue": picker.hex = t.dataset.value; renderColorHeaderPreviewOnly(); break;
      case "color-delete-ask": ui.colorDeleteConfirm = t.dataset.value; renderDeleteConfirm(); break;
      case "apply-color": {
        var nameInput = document.getElementById("cp-name");
        var newName = ((nameInput ? nameInput.value : picker.name) || "").trim();
        if (!newName) { pushToast("Bitte einen Farbnamen eingeben", "danger"); break; }
        var savedC = addPaletteColor(newName, picker.hex, { translucent: picker.translucent, glow: picker.glow });
        if (savedC) { draft.farbe = savedC.name; picker.name = savedC.name; clearFieldError("farbe"); }
        renderColorField();
        pushToast("Farbe übernommen");
        break;
      }
      case "pick-select": {
        var kind = t.dataset.kind;
        draft[kind] = t.dataset.value;
        if (kind === "verpackung") { syncAktuellForOriginalverpackt(); updatePreview(); }
        renderPicker(kind);
        break;
      }
      case "pick-open": ui[pickFlagByKind[t.dataset.kind]] = true; renderPicker(t.dataset.kind); break;
      case "pick-cancel": cancelPick(t.dataset.kind); break;
      case "pick-confirm": confirmPick(t.dataset.kind); break;
      case "pick-delete-ask": ui.pickDeleteConfirm = { kind: t.dataset.kind, value: t.dataset.value }; renderDeleteConfirm(); break;
      case "toggle-datepicker": ui.datePickerOpen = !ui.datePickerOpen; renderDateField(); break;
      case "date-year": ui.datePickerYear += parseInt(t.dataset.dir, 10); renderDateField(); break;
      case "date-pick": {
        var m = String(t.dataset.month).padStart(2, "0");
        draft.kaufdatum = ui.datePickerYear + "-" + m;
        ui.datePickerOpen = false;
        renderDateField();
        break;
      }
      case "date-clear": draft.kaufdatum = ""; ui.datePickerOpen = false; renderDateField(); break;
    }
  }

  document.addEventListener("click", function (e) {
    // Modal-Klicks (delegiert auf document, da modal-root ausserhalb von #root liegt)
    if (e.target.closest("#confirm-root")) { onConfirmClick(e); return; }
    if (e.target.closest("#modal-root")) { onModalClick(e); return; }
    if (e.target.closest("#import-root")) { onImportClick(e); return; }
    if (e.target.closest("#settings-root")) { onSettingsClick(e); return; }
    if (e.target.closest("#chart-root")) { onChartClick(e); return; }
    // Datepicker-Popover schliessen bei Klick ausserhalb
    if (ui.datePickerOpen && !e.target.closest(".ft-datepop-wrap")) { ui.datePickerOpen = false; renderDateField(); }
    if (ui.exportMenuOpen && !e.target.closest("#export-wrap")) { ui.exportMenuOpen = false; renderExportMenu(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (ui.datePickerOpen) { ui.datePickerOpen = false; renderDateField(); return; }
      if (ui.colorDeleteConfirm || ui.pickDeleteConfirm || ui.materialInfoOpen) { ui.colorDeleteConfirm = null; ui.pickDeleteConfirm = null; ui.materialInfoOpen = null; renderDeleteConfirm(); return; }
      if (ui.importDialog) { closeImportDialog(); return; }
      if (ui.settingsOpen) { closeSettings(); return; }
      if (ui.chartOpen) { closeChart(); return; }
      if (ui.modal) { closeModal(); }
    }
  });

  /* ------------------------------------------------------------------ *
   * Init
   * ------------------------------------------------------------------ */
  function init() {
    var scriptEl = document.getElementById("app-logic");
    APP_LOGIC_SOURCE = scriptEl ? scriptEl.textContent : "";
    state = loadInitialState();
    renderShell();
    renderThemeToggle();
    initExportMenuShell();
    renderExportMenu();
    renderAll();
    syncInit();
  }

  /* Service Worker: macht die App installierbar und offline startfaehig.
     Nur ueber https bzw. lokal - sonst lehnt der Browser ihn ohnehin ab.
     Ein Fehlschlag ist unkritisch, die Seite laeuft dann einfach normal. */
  if ("serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* egal */ });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
